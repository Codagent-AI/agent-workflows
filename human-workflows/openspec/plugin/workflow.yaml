name: define-openspec-change
description: Interactively define a structured change through proposal, specification, design, and testing strategy.

# Placeholders: {{change_name}} is the change's name, {{reviews_dir}} is this plugin's reviews folder, which holds the instructions the crosscheck child reads.
# A step with tools: [call_agent] may run a crosscheck review with the call_agent tool.

steps:
  - id: proposal
    tools: [call_agent]
    prompt: |
      Help the user write the proposal for OpenSpec change "{{change_name}}". Treat what the user already said earlier in this conversation as context they have already provided, and do not ask them to repeat it. If they have not yet said what the change is about, first ask what the change is about and do not guess. That earlier conversation is prior factual context only: it is not approval of a direction, authorization to write, or a substitute for confirmation required by the define-openspec-change:propose skill. You MUST use the define-openspec-change:propose skill and write the proposal to `openspec/changes/{{change_name}}/proposal.md`.

      Keep every OpenSpec definition and planning artifact under the repository-local `openspec/changes/{{change_name}}/` directory.

      Once the proposal draft is complete, use the define-openspec-change:call-agent skill with a fresh `agent: crosscheck` to obtain one adversarial review. Do not run that review yourself. The task-specific child instructions must require it to read and follow the review instructions at `{{reviews_dir}}/proposal-review.md`, read the proposal under `openspec/changes/{{change_name}}/`, inspect relevant repository context, provide clear actionable feedback with recommended resolutions, and never modify files.

      Follow define-openspec-change:call-agent's verification and user-facing reporting rules. Discuss every consequential finding with the user. Do not modify the proposal or any other file in response to review feedback until you have presented your assessment and received the user's explicit confirmation about which changes to make. Apply only the changes the user confirms.

      Keep this phase interactive through the proposal review. Once the user approves the final proposal content or tells you to write it, complete the approved edits and continue to the next step without asking them to review the written artifact again.

  - id: specs
    prompt: |
      Help the user write the specifications for OpenSpec change "{{change_name}}". You MUST use the define-openspec-change:spec skill and write the specifications under `openspec/changes/{{change_name}}/specs/`.

      Keep this phase interactive while developing the specifications. Once the user approves the content or tells you to write it, complete the specification artifacts and continue to the next step without asking them to review the written artifacts again.

  - id: design
    prompt: |
      Help the user design OpenSpec change "{{change_name}}". You MUST use the define-openspec-change:design skill and write the design to `openspec/changes/{{change_name}}/design.md`.

      Keep this phase interactive while developing the design. Once the user approves the content or tells you to write it, complete the design artifact and continue to the next step without asking them to review the written artifact again.

  - id: test-plan
    prompt: |
      Use the define-openspec-change:test-plan skill to collaboratively create `openspec/changes/{{change_name}}/test-plan.md`.

      Keep this phase interactive while developing the test plan. Once the user approves the content or tells you to write it, complete the test plan and continue to the next step without asking them to review the written artifact again.

  - id: approach-review
    tools: [call_agent]
    prompt: |
      You MUST use the define-openspec-change:call-agent skill with a fresh `agent: crosscheck` to obtain one independent definition review for OpenSpec change "{{change_name}}". Do not perform that review yourself.

      The task-specific child instructions must require the child to read and follow the review instructions at `{{reviews_dir}}/review-approach.md` and independently review the proposal, every specification, the design, and `test-plan.md` under `openspec/changes/{{change_name}}/` together.

      Require the child to check cross-artifact consistency and testability; find consequential behavioral, architectural, or testing-strategy gaps, missing decisions, weak tradeoffs, failure modes, and better alternatives; inspect relevant repository patterns; avoid reviewing implementation tasks; and never modify files.

      Follow define-openspec-change:call-agent's verification and user-facing reporting rules. Discuss every consequential finding with the user. Do not modify the proposal, specifications, design, test plan, or any other file until you have presented your assessment and received the user's explicit confirmation about which changes to make. Apply only the changes the user confirms.

      Keep this phase interactive through the review discussion. Once the user approves the resulting changes, apply them and continue to the next step without asking them to review the updated artifacts again.
