name: define-openspec-change
description: Interactively define a structured change through proposal, specification, design, and testing strategy.

# Placeholders: {{change_name}} is the change name. {{review:<file>}} embeds a file from reviews/.

shared_prompts:
  # After every step's prompt.
  every_step: |
    Keep this step interactive with the user, through any review discussion. Once the user approves the content or the changes, or tells you to write them, write them to the step's artifacts and continue to the next step without asking the user to review the written artifacts again.

steps:
  - id: proposal
    prompt: |
      Help the user write the proposal for OpenSpec change "{{change_name}}". Treat what the user already said earlier in this conversation as context they have already provided, and do not ask them to repeat it. If they have not yet said what the change is about, first ask what the change is about and do not guess. That earlier conversation is prior factual context only: it is not approval of a direction, authorization to write, or a substitute for confirmation required by the define-openspec-change:propose skill. You MUST use the define-openspec-change:propose skill and write the proposal to `openspec/changes/{{change_name}}/proposal.md`.

      Keep every OpenSpec definition and planning artifact under the repository-local `openspec/changes/{{change_name}}/` directory.

      Once the proposal draft is complete, call `crosscheck` once with `change_name` set to "{{change_name}}". Give the reviewers a self-contained prompt asking them to review `openspec/changes/{{change_name}}/proposal.md`, inspect relevant repository context, and propose actionable resolutions. Strictly tell them to change nothing. Include these instructions verbatim in the prompt:

      {{review:proposal-review.md}}

      If the result is running, poll `get_crosscheck` with its ID until it finishes. Check each finding before reporting a combined result, including failed reviewers and changed paths. Discuss consequential findings with the user and obtain explicit confirmation before applying any changes.

  - id: specs
    prompt: |
      Help the user write the specifications for OpenSpec change "{{change_name}}". You MUST use the define-openspec-change:spec skill and write the specifications under `openspec/changes/{{change_name}}/specs/`.

  - id: design
    prompt: |
      Help the user design OpenSpec change "{{change_name}}". You MUST use the define-openspec-change:design skill and write the design to `openspec/changes/{{change_name}}/design.md`.

  - id: test-plan
    prompt: |
      Use the define-openspec-change:test-plan skill to collaboratively create `openspec/changes/{{change_name}}/test-plan.md`.

  - id: approach-review
    prompt: |
      Call `crosscheck` once with `change_name` set to "{{change_name}}". Write a self-contained prompt asking the reviewers to independently examine the proposal, every specification, design and test plan in `openspec/changes/{{change_name}}/` together. Ask for consequential gaps, weak tradeoffs, failure modes, and better alternatives. Strictly tell the reviewers to change nothing. Include these instructions verbatim in the prompt:

      {{review:review-approach.md}}

      If the result is running, poll `get_crosscheck` with its ID until it finishes. Verify each finding against the artifacts and relevant repository context. Report one combined result with failed reviewers and changed paths, discuss consequential findings with the user, and obtain explicit confirmation before applying any changes.
