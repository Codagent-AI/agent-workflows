name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Each folder's job runs only when a pull request changes that folder. A
  # skipped job counts as passing, so branch protection can require them all.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      archon: ${{ steps.diff.outputs.archon }}
      openspec: ${{ steps.diff.outputs.openspec }}
    steps:
      - id: diff
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            archon:
              - factory-workflows/archon/**
            openspec:
              - human-workflows/openspec/**

  archon:
    name: archon
    needs: changes
    if: needs.changes.outputs.archon == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: factory-workflows/archon
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The dry-run fixtures run on Archon from source: the Codagent-AI fork's
      # dev branch, synced with upstream, at the commit the pack is tested with.
      - uses: actions/checkout@v7
        with:
          repository: Codagent-AI/Archon
          ref: 0ab333c6fe69428e5717b89eb3c0538c18cd965e
          path: .ci/archon
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - run: bun install --frozen-lockfile
        working-directory: .ci/archon
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test tests/
      - run: bun run test:fixtures
        env:
          ARCHON: bun ${{ github.workspace }}/.ci/archon/packages/cli/src/cli.ts

  openspec:
    name: openspec
    needs: changes
    if: needs.changes.outputs.openspec == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: human-workflows/openspec/server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: human-workflows/openspec/server/package-lock.json
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run check
