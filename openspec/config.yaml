schema: spec-driven

context: |
  This one OpenSpec project holds the changes for every project in the repository: the
  define-openspec-change plugin in human-workflows/openspec/ and the Archon pack in
  factory-workflows/archon/. Say which project a change is for, and give paths from the repository root.
  Do not name the tools a project was copied from, or any evaluation repository, in change artifacts.
  Each project records where its files came from only in its own PROVENANCE.md
  (human-workflows/openspec/plugin/PROVENANCE.md, factory-workflows/archon/PROVENANCE.md); point to that file instead.
  For the plugin: only human-workflows/openspec/plugin/ ships. Do not put anything the plugin needs at run time outside it.
  For the Archon pack: keep artifacts provider-neutral. Agent nodes use role aliases, never a provider or model.
  Use plain, short sentences and no em-dashes.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
