# Agent Validator for agent-workflows. Reviews use the CLI and model from your
# global agent-validator config.
#
# Changes are diffed against base_branch. A worktree with no validator_logs
# state is checked against its full diff from main.
base_branch: origin/main

# entry_points configured by /validator-setup
entry_points:
  # Repository files outside the workflow folders: README, AGENTS.md, LICENSE,
  # the plugin marketplaces, .gitignore.
  - path: .
    exclude:
      - .validator
      - human-workflows
      - factory-workflows
    reviews:
      - all-reviewers:
          builtin: all-reviewers

  # The define-openspec-change plugin and its TypeScript tool server.
  - path: human-workflows/openspec
    exclude:
      # The esbuild bundle of server/src; the check verifies it matches a fresh build.
      - plugin/server.mjs
      - server/package-lock.json
    checks:
      # Biome lint (complexity, function and file size) and jscpd duplication.
      # This check and the next both install into server/node_modules, so they
      # run one after the other.
      - openspec-server-lint:
          command: npm run lint:ci
          working_directory: human-workflows/openspec/server
          parallel: false
      # Typecheck, bundle-matches-build, and the node:test suite.
      - openspec-server:
          command: npm run check:ci
          working_directory: human-workflows/openspec/server
          parallel: false
      - openspec-server-audit:
          command: npm audit --audit-level=moderate
          working_directory: human-workflows/openspec/server
    reviews:
      - all-reviewers

  # The Archon factory workflow pack.
  - path: factory-workflows/archon
    checks:
      # Validates the workflows and replays their dry-run fixtures (stubbed
      # agents, no model calls). Set ARCHON to use an Archon other than the one
      # on PATH, such as `bun <archon checkout>/packages/cli/src/cli.ts`.
      - archon-workflows:
          command: bun run test:fixtures
          working_directory: factory-workflows/archon
          timeout: 900
      # Biome lint (complexity, function and file size) and jscpd duplication
      # over the TypeScript and workflow YAML.
      - archon-lint:
          command: bun run lint:ci
          working_directory: factory-workflows/archon
      # The TypeScript check modules, against temporary git repositories and
      # fake gh and openspec commands.
      - archon-scripts:
          command: bun test tests/
          working_directory: factory-workflows/archon
          timeout: 600
    reviews:
      - all-reviewers
