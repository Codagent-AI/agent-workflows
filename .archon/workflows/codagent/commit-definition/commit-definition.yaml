name: codagent-commit-definition
description: >-
  Building block of codagent-implement-change; not for standalone runs. Port of
  Agent Runner core commit-definition-v1.0: commit an approved change
  definition for a workflow without a planning step, and require a clean
  worktree before implementation starts.

inputs:
  change_name: {}
  change_dir: {}
  change_kind: {}
  skip_validator: {}
  session_dir: {}

nodes:
  # Runner skips this step for spec-driven changes (skip_if). The port keeps
  # the node and passes it, so the clean check below always has a dependency
  # that ran.
  - id: commit-definition
    bash: |
      if [ "$INPUTS_CHANGE_KIND" = spec-driven ]; then
        jq -n '{status: "PASS", stdout: "", output: "", evidence: ""}'
        exit 0
      fi
      CHECK_INPUT=$(jq -n --arg change_name "$INPUTS_CHANGE_NAME" --arg change_dir "$INPUTS_CHANGE_DIR" \
        --arg skip_validator "$INPUTS_SKIP_VALIDATOR" '{change_name: $change_name, change_dir: $change_dir, skip_validator: $skip_validator}') \
        sh "$PACK_DIR/.shared/bin/check.sh" status sh "$PACK_DIR/.shared/core/commit-change-plan.sh"
    output_format: &check-result
      type: object
      properties:
        status: { type: string, enum: [PASS, FAIL] }
        stdout: { type: string }
        output: { type: string }
        evidence: { type: string }
      required: [status, stdout, output, evidence]

  - id: commit-definition-repair
    depends_on: [commit-definition]
    when: "$commit-definition.output.status == 'FAIL'"
    model: '@lead'
    settingSources: [project]
    context: fresh
    prompt: |
      commit only $INPUTS.change_dir following repository conventions. Never declare success yourself; the check that runs after you decides. If only a human can resolve the failure, make no unsafe change, explain why, and end your response with the line `REPAIR_BLOCKED`.

      $commit-definition.output.evidence

  - id: commit-definition-repair-blocked
    depends_on: [commit-definition-repair]
    bash: AGENT_RESPONSE=$commit-definition-repair.output sh "$PACK_DIR/.shared/bin/repair-blocked.sh"

  - id: commit-definition-2
    depends_on: [commit-definition-repair-blocked]
    bash: |
      jq -n --arg change_name "$INPUTS_CHANGE_NAME" --arg change_dir "$INPUTS_CHANGE_DIR" \
        --arg skip_validator "$INPUTS_SKIP_VALIDATOR" '{change_name: $change_name, change_dir: $change_dir, skip_validator: $skip_validator}' \
        | sh "$PACK_DIR/.shared/core/commit-change-plan.sh"

  - id: check-clean-before-implementation
    depends_on: [commit-definition, commit-definition-2]
    trigger_rule: none_failed_min_one_success
    bash: |
      if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
        echo "tracked worktree changes exist before implementation; commit or remove them before continuing" >&2
        exit 1
      fi
