record-definition-head: { head: "1111111111111111111111111111111111111111" }
implementor-checklist: "Wrote the checklist."
check-implementor-checklist-not-blocked: "not blocked"
check-implementor-checklist: "checklist committed"
verify-checklist: { ok: true, problems: "" }
record-implementation-start: { head: "2222222222222222222222222222222222222222" }
implement: "Implemented the change."
check-implementation-not-blocked: "not blocked"
check-evidence: { ok: false, problems: "evidence check: I-2 is verified but cites no non-empty file" }
complete-evidence: { blocked: false, reason: "" }
evidence-recheck: { ok: true, problems: "" }
audit: "I-2: the fallback greeting has no test that asserts it (specs/greeting/spec.md)."
