# A checklist repair that reports itself blocked fails the recheck.
validate-inputs: { change_dir: tests/data/changes/valid-change, artifact_validation_instruction: "Validate any changed spec artifact." }
check-definition__validate-definition: { ok: true, problems: "" }
check-definition__verify-definition: { ok: true, problems: "" }
commit-definition__commit-definition: { ok: true, problems: "", message: "a spec-driven change commits its definition in its planning step" }
commit-definition__check-clean-before-implementation: "no tracked changes"
implementor-checklist: "Wrote the checklist."
check-implementor-checklist-not-blocked: "not blocked"
check-implementor-checklist: "checklist committed"
verify-checklist: { ok: false, problems: "checklist.md has uncommitted changes" }
repair-checklist: { blocked: true, reason: "the checklist path is outside the repository" }
exec-code: true
fixture:
  expect: failed
  fail-node: recheck-checklist
  reached: [repair-checklist]
  inputs:
    change_name: valid-change
    changes_root: tests/data/changes
    change_kind: spec-driven
    artifact_validation_instruction: Validate any changed spec artifact.
