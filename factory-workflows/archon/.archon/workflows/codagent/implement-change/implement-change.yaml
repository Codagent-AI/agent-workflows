name: codagent-implement-change
description: >-
  Implement a defined change in one implementor session against its own
  checklist of how each spec behavior is verified, have the reviewer audit
  the result, archive the change, finalize CI and publish the review package.

# Each agent node names a role alias (@implementor, @reviewer,
# @tester) with a tier fallback; bind the aliases in the launch checkout's
# .archon/config.yaml. Agents record rulings and the blocked record under
# $ARTIFACTS_DIR, with the file names the README lists.

# End the run from its recorded review or acceptance outcome.
returns: end-run
outcome_field: succeeded

# The change_name is the run's own input. The rest are the pack's settings (.pack/pack.yaml),
# which this run reads as $INPUTS and passes to the blocks it includes, since a block takes
# nothing from its pack.
inputs:
  change_name:
    required: true
    description: Change name (lowercase letters, digits and hyphens).

nodes:
  - id: validate-inputs
    script: validate-inputs
    runtime: bun
    with:
      change_name: $INPUTS.change_name
      acceptance_rounds: $INPUTS.acceptance_rounds
      acceptance_fix_scope: $INPUTS.acceptance_fix_scope
      review_strategy: $INPUTS.review_strategy
      stop_after: $INPUTS.stop_after
      review_wait: $INPUTS.review_wait
      # The acceptance loop's literal ceiling.
      max_rounds: &max-rounds 10
    output_format:
      type: object
      properties:
        change_dir: { type: string }
        artifact_validation_instruction: { type: string }
        rounds: { type: integer }
        review: { type: boolean }
        finish: { type: boolean }
      required: [change_dir, artifact_validation_instruction, rounds, review, finish]
      additionalProperties: false

  # The forge plugin and its credential are checked before any agent spends.
  - id: check-forge
    depends_on: [validate-inputs]
    script: check-forge
    runtime: bun
    with:
      review_wait: $INPUTS.review_wait

  - id: check-definition
    depends_on: [check-forge]
    include: codagent-check-definition
    with:
      change_name: $INPUTS.change_name
      change_dir: $validate-inputs.output.change_dir

  # Without a planning step, commit the approved definition here so the
  # checklist and implementation commits start from a committed definition.
  - id: commit-definition
    depends_on: [check-definition]
    include: codagent-commit-definition
    with:
      change_name: $INPUTS.change_name
      change_dir: $validate-inputs.output.change_dir

  # The implementor's session starts here and owns the whole change: its
  # checklist, the implementation, and fixes. Every step on it returns this one
  # schema, since a step whose schema differs from the step before it misses the
  # provider's prompt cache. A step returns the fields it does not use empty, and
  # the check after each step stops the run when it reports itself blocked.
  - id: implementor-checklist
    depends_on: [commit-definition]
    model: ['@implementor', large]
    context: fresh
    command: implementor-checklist
    with: &change
      change_name: $INPUTS.change_name
      change_dir: $validate-inputs.output.change_dir
    output_format: &implementor-result
      type: object
      properties:
        blocked: { type: boolean }
        reason: { type: string }
        actions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              action: { type: string, enum: [fixed, declined, replied] }
              note: { type: string }
            required: [id, action, note]
            additionalProperties: false
      required: [blocked, reason, actions]
      additionalProperties: false

  - id: check-implementor-checklist-not-blocked
    depends_on: [implementor-checklist]
    script: check-not-blocked
    runtime: bun
    with:
      blocked: $implementor-checklist.output.blocked
      reason: $implementor-checklist.output.reason

  - id: check-implementor-checklist
    depends_on: [check-implementor-checklist-not-blocked]
    script: check-implementor-checklist
    runtime: bun
    with:
      change_dir: $validate-inputs.output.change_dir
      change_name: $INPUTS.change_name
      start: "$implementor-checklist.execution.checkoutStart"

  - id: verify-checklist
    depends_on: [check-implementor-checklist]
    script: verify-checklist
    runtime: bun
    with:
      change_dir: $validate-inputs.output.change_dir
      strict: false
      blocked: false
      reason: ""
    output_format: &check
      type: object
      properties:
        ok: { type: boolean }
        problems: { type: string }
      required: [ok, problems]
      additionalProperties: false

  - id: repair-checklist
    depends_on: [verify-checklist]
    when: "$verify-checklist.output.ok == 'false'"
    model: ['@implementor', large]
    context: { resume: implementor-checklist }
    command: repair-checklist
    with:
      change_name: $INPUTS.change_name
      change_dir: $validate-inputs.output.change_dir
      problems: $verify-checklist.output.problems
    output_format: *implementor-result

  - id: recheck-checklist
    depends_on: [repair-checklist]
    script: verify-checklist
    runtime: bun
    with:
      change_dir: $validate-inputs.output.change_dir
      strict: true
      blocked: $repair-checklist.output.blocked
      reason: $repair-checklist.output.reason
    output_format: *check

  - id: implement
    depends_on: [verify-checklist, recheck-checklist]
    trigger_rule: none_failed_min_one_success
    model: ['@implementor', large]
    context: { resume: implementor-checklist }
    command: implement
    with: &change-and-validation
      change_name: $INPUTS.change_name
      change_dir: $validate-inputs.output.change_dir
      artifact_validation_instruction: $validate-inputs.output.artifact_validation_instruction
    output_format: *implementor-result

  - id: save-implementor-response
    depends_on: [implement]
    script: save-implementor-response
    runtime: bun
    with:
      result: $implement.output

  - id: complete-implementation
    depends_on: [save-implementor-response]
    loop_group:
      max_iterations: 12
      on_exhausted: fail
      until_bash: 'done=$check-completion-verdict.output.done; [ "$done" = true ]'
      nodes:
        - id: check-completion
          script: check-completion
          runtime: bun
          with:
            change_dir: $validate-inputs.output.change_dir
            start: $implement.execution.checkoutStart
            blocked: $LOOP_PREV.continue-implementation.output.blocked
            initial_blocked: $implement.output.blocked
            previous: $LOOP_PREV.check-completion-verdict.output.iteration
          output_format:
            type: object
            properties:
              complete: { type: boolean }
              judge: { type: boolean }
              iteration: { type: integer }
              start: { type: string }
            required: [complete, judge, iteration, start]
            additionalProperties: false
        - id: judge-completion
          depends_on: [check-completion]
          when: "$check-completion.output.judge == 'true'"
          model: ['@tester', medium]
          context: fresh
          command: judge-completion
          with:
            change_dir: $validate-inputs.output.change_dir
            start: $check-completion.output.start
            change_name: $INPUTS.change_name
          output_format:
            type: object
            properties:
              verdict: { type: string, enum: [blocked, continue, fix-record, complete] }
              reason: { type: string }
              remaining: { type: string }
            required: [verdict, reason, remaining]
            additionalProperties: false
        - id: check-completion-verdict
          depends_on: [check-completion, judge-completion]
          trigger_rule: none_failed_min_one_success
          script: check-completion-verdict
          runtime: bun
          with:
            change_dir: $validate-inputs.output.change_dir
            start: $implement.execution.checkoutStart
            iteration: $check-completion.output.iteration
            result: { from: $judge-completion.output, if_skipped: "" }
          output_format:
            type: object
            properties:
              done: { type: boolean }
              verdict: { type: string }
              remaining: { type: string }
              iteration: { type: integer }
            required: [done, verdict, remaining, iteration]
            additionalProperties: false
        - id: continue-implementation
          depends_on: [check-completion-verdict]
          when: "$check-completion-verdict.output.verdict == 'continue'"
          model: ['@implementor', large]
          context: { resume: implement }
          command: continue-implementation
          with:
            <<: *change-and-validation
            remaining: $check-completion-verdict.output.remaining
          output_format: *implementor-result
        - id: save-continue-response
          depends_on: [continue-implementation]
          script: save-implementor-response
          runtime: bun
          with:
            result: $continue-implementation.output

  - id: audit
    depends_on: [complete-implementation]
    trigger_rule: none_failed_min_one_success
    model: ['@reviewer', large]
    context: fresh
    command: audit
    with: *change
    output_type: findings

  - id: resolve-findings
    depends_on: [audit]
    model: ['@implementor', large]
    context: { resume: implement }
    command: resolve-findings
    with:
      change_name: $INPUTS.change_name
      change_dir: $validate-inputs.output.change_dir
      artifact_validation_instruction: $validate-inputs.output.artifact_validation_instruction
      findings: $audit.output
    output_format: *implementor-result

  - id: check-findings-not-blocked
    depends_on: [resolve-findings]
    script: check-not-blocked
    runtime: bun
    with:
      blocked: $resolve-findings.output.blocked
      reason: $resolve-findings.output.reason

  # As check-evidence, after the findings are fixed: a planned row may change
  # only where an audit finding names its ID.
  - id: recheck-evidence
    depends_on: [check-findings-not-blocked]
    script: recheck-evidence
    runtime: bun
    with:
      change_dir: $validate-inputs.output.change_dir
      findings: $audit.output
      strict: false
      blocked: false
      reason: ""
    output_format: *check

  - id: evidence-repairs-after-review
    depends_on: [recheck-evidence]
    when: "$recheck-evidence.output.ok == 'false'"
    loop_group:
      max_iterations: 2
      on_exhausted: fail
      until_bash: 'ok=$evidence-recheck-after-review.output.ok; [ "$ok" = true ]'
      nodes:
        - id: complete-evidence-after-review
          model: ['@implementor', large]
          context: { resume: resolve-findings }
          command: complete-evidence
          with:
            change_name: $INPUTS.change_name
            change_dir: $validate-inputs.output.change_dir
          output_format: *implementor-result
        - id: evidence-recheck-after-review
          depends_on: [complete-evidence-after-review]
          script: recheck-evidence
          runtime: bun
          with:
            change_dir: $validate-inputs.output.change_dir
            findings: $audit.output
            blocked: $complete-evidence-after-review.output.blocked
            reason: $complete-evidence-after-review.output.reason
            strict: false
          output_format: *check

  - id: check-clean
    depends_on: [recheck-evidence, evidence-repairs-after-review]
    trigger_rule: none_failed_min_one_success
    script: check-clean
    runtime: bun
    with:
      strict: false
      blocked: false
      reason: ""
    output_format: *check

  - id: repair-clean
    depends_on: [check-clean]
    when: "$check-clean.output.ok == 'false'"
    model: ['@implementor', large]
    context: { resume: resolve-findings }
    command: repair-clean
    with:
      change_name: $INPUTS.change_name
      change_dir: $validate-inputs.output.change_dir
      problems: $check-clean.output.problems
    output_format: *implementor-result

  - id: recheck-clean
    depends_on: [repair-clean]
    script: check-clean
    runtime: bun
    with:
      strict: true
      blocked: $repair-clean.output.blocked
      reason: $repair-clean.output.reason
    output_format: *check

  - id: verify-implementation-commits
    depends_on: [check-clean, recheck-clean]
    trigger_rule: none_failed_min_one_success
    script: verify-implementation-commits
    runtime: bun
    with:
      start: "$implement.execution.checkoutStart"
      strict: false
      blocked: false
      reason: ""
    output_format: *check

  - id: repair-implementation-commits
    depends_on: [verify-implementation-commits]
    when: "$verify-implementation-commits.output.ok == 'false'"
    model: ['@implementor', large]
    context: { resume: resolve-findings }
    command: repair-implementation-commits
    with:
      change_name: $INPUTS.change_name
      change_dir: $validate-inputs.output.change_dir
      start: "$implement.execution.checkoutStart"
      problems: $verify-implementation-commits.output.problems
    output_format: *implementor-result

  - id: recheck-implementation-commits
    depends_on: [repair-implementation-commits]
    script: verify-implementation-commits
    runtime: bun
    with:
      start: "$implement.execution.checkoutStart"
      strict: true
      blocked: $repair-implementation-commits.output.blocked
      reason: $repair-implementation-commits.output.reason
    output_format: *check

  # The agent writes $ARTIFACTS_DIR/session-report.md, which the acceptance
  # tester reads.
  - id: session-report
    depends_on: [verify-implementation-commits, recheck-implementation-commits]
    trigger_rule: none_failed_min_one_success
    model: ['@implementor', large]
    context: { resume: resolve-findings }
    command: session-report
    with: *change
    output_format: *implementor-result

  - id: prepare-review
    depends_on: [session-report]
    trigger_rule: none_failed_min_one_success
    when: "$validate-inputs.output.review == 'true'"
    script: prepare-review
    runtime: bun
    with: &before-review
      place: before-pr
      mode: initial
      answers_file: ""
      change_dir: $validate-inputs.output.change_dir
      start: $implementor-checklist.execution.checkoutStart
      round: 0
    output_format: &review-range
      type: object
      properties:
        needed: { type: boolean }
        start: { type: string }
        end: { type: string }
        files: { type: string }
        revisions: { type: string }
        findings: { type: string }
        handed_off: { type: string }
      required: [needed, start, end, files, findings, handed_off]
      additionalProperties: false

  - id: review-change
    depends_on: [prepare-review]
    when: "$validate-inputs.output.review == 'true' && $prepare-review.output.needed == 'true'"
    model: ['@reviewer', medium]
    context: fresh
    mutates_checkout: false
    command: review-change
    with: &before-review-command
      place: before-pr
      requested: ""
      feedback_revisions: ""
      change_dir: $validate-inputs.output.change_dir
      start: $prepare-review.output.start
      end: $prepare-review.output.end
      files: $prepare-review.output.files
      handed_off: $prepare-review.output.handed_off
    # The first review and its re-reviews share one schema, so a re-review that
    # continues the reviewer's session reuses its prompt cache. A first review
    # returns no verdicts.
    output_format: &review-output
      type: object
      properties:
        verdicts:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              verdict: { type: string, enum: [confirmed, rejected, accepted, contested] }
              reason: { type: string }
            required: [id, verdict, reason]
            additionalProperties: false
        findings:
          type: array
          items: &finding
            type: object
            properties:
              title: { type: string }
              file: { type: string }
              line: { type: integer }
              severity: { type: string, enum: [high, medium, low] }
              category: { type: string, enum: [quality, security, error-handling] }
              problem: { type: string }
              fix: { type: string }
            required: [title, file, line, severity, category, problem, fix]
            additionalProperties: false
      required: [verdicts, findings]
      additionalProperties: false

  - id: record-review
    depends_on: [prepare-review, review-change]
    trigger_rule: none_failed_min_one_success
    when: "$validate-inputs.output.review == 'true'"
    script: record-review
    runtime: bun
    with:
      <<: *before-review
      needed: $prepare-review.output.needed
      end: $prepare-review.output.end
      review_name: review-change
      result: { from: $review-change.output, if_skipped: "" }
    output_format: &review-settled
      type: object
      properties:
        settled: { type: boolean }
        findings: { type: string }
      required: [settled, findings]
      additionalProperties: false

  - id: review-fixes
    depends_on: [record-review]
    when: "$validate-inputs.output.review == 'true' && $record-review.output.settled == 'false'"
    loop_group:
      max_iterations: 3
      on_exhausted: complete
      until_bash: 'stop=$end-review-round.output.stop; [ "$stop" = true ]'
      nodes:
        - id: fix-review-findings
          model: ['@implementor', large]
          context: { resume: session-report }
          command: fix-review-findings
          with:
            place: before-pr
            findings: $record-review.output.findings
          output_format: *implementor-result

        - id: record-review-fixes
          depends_on: [fix-review-findings]
          script: record-review-fixes
          runtime: bun
          with:
            place: before-pr
            review_name: fix-review-findings
            result: $fix-review-findings.output
          output_format: &review-fix-range
            type: object
            properties:
              blocked: { type: boolean }
              start: { type: string }
              end: { type: string }
              findings: { type: string }
            required: [blocked, start, end, findings]
            additionalProperties: false

        - id: re-review
          depends_on: [record-review-fixes]
          when: "$record-review-fixes.output.blocked == 'false'"
          model: ['@reviewer', medium]
          context: { resume: review-change }
          mutates_checkout: false
          command: re-review
          with:
            place: before-pr
            change_dir: $validate-inputs.output.change_dir
            start: $record-review-fixes.output.start
            end: $record-review-fixes.output.end
            findings: $record-review-fixes.output.findings
          output_format: *review-output

        - id: end-review-round
          depends_on: [record-review-fixes, re-review]
          trigger_rule: none_failed_min_one_success
          script: end-review-round
          runtime: bun
          with:
            place: before-pr
            blocked: $record-review-fixes.output.blocked
            end: $record-review-fixes.output.end
            review_name: re-review
            result: { from: $re-review.output, if_skipped: "" }
          output_format: &review-stop
            type: object
            properties:
              stop: { type: boolean }
              findings: { type: string }
            required: [stop, findings]
            additionalProperties: false

  - id: hand-off-review
    depends_on: [record-review, review-fixes]
    trigger_rule: none_failed_min_one_success
    when: "$validate-inputs.output.review == 'true'"
    script: hand-off-review
    runtime: bun
    with:
      place: before-pr
      change_dir: ""
    output_format: &review-handoff
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
      additionalProperties: false

  - id: verify-clean-for-pr
    depends_on: [hand-off-review, session-report]
    trigger_rule: none_failed_min_one_success
    script: verify-clean-for-pr
    runtime: bun
    with:
      strict: false
      blocked: false
      reason: ""
    output_format: *check

  - id: repair-clean-for-pr
    depends_on: [verify-clean-for-pr]
    when: "$verify-clean-for-pr.output.ok == 'false'"
    model: ['@implementor', large]
    context: { resume: session-report }
    command: repair-clean-for-pr
    with:
      change_name: $INPUTS.change_name
      problems: $verify-clean-for-pr.output.problems
    output_format: *implementor-result

  - id: recheck-clean-for-pr
    depends_on: [repair-clean-for-pr]
    script: verify-clean-for-pr
    runtime: bun
    with:
      strict: true
      blocked: $repair-clean-for-pr.output.blocked
      reason: $repair-clean-for-pr.output.reason
    output_format: *check

  - id: prepare-tail-review
    depends_on: [verify-clean-for-pr, recheck-clean-for-pr]
    trigger_rule: none_failed_min_one_success
    when: "$validate-inputs.output.review == 'true'"
    script: prepare-review
    runtime: bun
    with:
      <<: *before-review
      mode: tail
      answers_file: ""
    output_format: *review-range

  - id: tail-review
    depends_on: [prepare-tail-review]
    when: "$validate-inputs.output.review == 'true' && $prepare-tail-review.output.needed == 'true'"
    model: ['@reviewer', medium]
    context: fresh
    mutates_checkout: false
    command: review-change
    with:
      <<: *before-review-command
      start: $prepare-tail-review.output.start
      end: $prepare-tail-review.output.end
      files: $prepare-tail-review.output.files
      handed_off: $prepare-tail-review.output.handed_off
    output_format: *review-output

  - id: record-tail-review
    depends_on: [prepare-tail-review, tail-review]
    trigger_rule: none_failed_min_one_success
    when: "$validate-inputs.output.review == 'true' && $prepare-tail-review.output.needed == 'true'"
    script: record-review
    runtime: bun
    with:
      <<: *before-review
      mode: tail
      answers_file: ""
      needed: $prepare-tail-review.output.needed
      end: $prepare-tail-review.output.end
      review_name: tail-review
      result: $tail-review.output
    output_format: *review-settled

  # The pull request is written in a fresh session, from the definition and the
  # branch's commits.
  - id: open-draft-pr
    depends_on: [verify-clean-for-pr, recheck-clean-for-pr, record-tail-review]
    trigger_rule: none_failed_min_one_success
    model: ['@implementor', large]
    context: fresh
    command: open-draft-pr
    with: *change
    output_format: &repair
      type: object
      properties:
        blocked: { type: boolean }
        reason: { type: string }
      required: [blocked, reason]
      additionalProperties: false

  # open-draft-pr writes the title and description to pr-title.txt and pr-body.md; this
  # opens the pull request as a draft, or puts the description into the open one's body
  # between the generated-body markers. A blocked open-draft-pr fails here.
  - id: publish-draft-pr
    depends_on: [open-draft-pr]
    script: publish-draft-pr
    runtime: bun
    with:
      strict: true
      blocked: $open-draft-pr.output.blocked
      reason: $open-draft-pr.output.reason
    output_format: *check

  # A brief GitHub lag retries inside the check instead of rerunning
  # open-draft-pr.
  - id: verify-draft-pr
    depends_on: [publish-draft-pr]
    script: check-draft-pr
    runtime: bun
    with:
      push: false
      attempts: 3
      interval_seconds: 3
      strict: false
      blocked: false
      reason: ""
    output_format: &pr-check
      type: object
      properties:
        ok: { type: boolean }
        problems: { type: string }
        pr_url: { type: string }
      required: [ok, problems, pr_url]
      additionalProperties: false

  # Runs open-draft-pr's step again in its session.
  - id: reopen-draft-pr
    depends_on: [verify-draft-pr]
    when: "$verify-draft-pr.output.ok == 'false'"
    model: ['@implementor', large]
    context: { resume: open-draft-pr }
    command: open-draft-pr
    with: *change
    output_format: *repair

  - id: publish-reopened-draft-pr
    depends_on: [reopen-draft-pr]
    script: publish-draft-pr
    runtime: bun
    with:
      strict: true
      blocked: $reopen-draft-pr.output.blocked
      reason: $reopen-draft-pr.output.reason
    output_format: *check

  - id: recheck-draft-pr
    depends_on: [publish-reopened-draft-pr]
    script: check-draft-pr
    runtime: bun
    with:
      push: false
      attempts: 3
      interval_seconds: 3
      strict: true
      blocked: false
      reason: ""
    output_format: *pr-check

  # Each round runs the independent tester, waits for CI, has the tester hand
  # off, then checks convergence. A round that does not converge is followed by
  # the implementor's fix, a push, and a PR check, and the next round retests. The
  # last round ends at the gate, so no fix is ever left untested.
  # max_iterations is the ceiling for acceptance_rounds; the gate ends the
  # rounds at acceptance_rounds.
  - id: acceptance-rounds
    depends_on: [verify-draft-pr, recheck-draft-pr]
    trigger_rule: none_failed_min_one_success
    loop_group:
      max_iterations: *max-rounds
      on_exhausted: complete
      until_bash: 'push=$check-acceptance-progress.output.push; [ "$push" = false ] || [ -f "$ARTIFACTS_DIR/acceptance-stop.txt" ]'
      nodes:
        # The gate must judge only evidence written in this round, so the
        # previous round's status and handoff are cleared.
        - id: reset-round-evidence
          script: reset-round-evidence
          runtime: bun
          with:
            previous_round: $LOOP_PREV.reset-round-evidence.output.round
            rounds: $validate-inputs.output.rounds
          output_format:
            type: object
            properties:
              round: { type: integer }
              last: { type: boolean }
            required: [round, last]
            additionalProperties: false

        # The tester's session for the round. The handoff continues it and returns
        # the same schema, so it reads the provider's prompt cache: `ready` means
        # ready for CI here, and the round ready in the handoff.
        - id: acceptance-test
          depends_on: [reset-round-evidence]
          model: ['@tester', medium]
          context: fresh
          command: acceptance-test
          with:
            change_name: $INPUTS.change_name
            change_dir: $validate-inputs.output.change_dir
            acceptance_round: $reset-round-evidence.output.round
            acceptance_rounds: $validate-inputs.output.rounds
            journeys: ""
          output_format: &tester-result
            type: object
            properties:
              ready: { type: boolean }
              reason: { type: string }
            required: [ready, reason]
            additionalProperties: false

        - id: wait-ci
          depends_on: [acceptance-test]
          when: "$acceptance-test.output.ready == 'true'"
          script: wait-ci
          runtime: bun
          # The wait polls for max_minutes; the timeout leaves room for the report.
          timeout: 1200000
          with:
            round: $reset-round-evidence.output.round
            max_minutes: 15
            interval_seconds: 30
          output_format:
            type: object
            properties:
              status: { type: string, enum: [passed, failed, pending, comments, error] }
              had_checks: { type: boolean }
              head_moved: { type: boolean }
              report: { type: string }
            required: [status, had_checks, head_moved, report]
            additionalProperties: false

        - id: acceptance-handoff
          depends_on: [acceptance-test, wait-ci]
          trigger_rule: none_failed_min_one_success
          model: ['@tester', medium]
          context: { resume: acceptance-test }
          command: acceptance-handoff
          with:
            ci_status: { from: $wait-ci.output.status, if_skipped: "not run" }
            ci_report: { from: $wait-ci.output.report, if_skipped: "none" }
            ci_reason: $acceptance-test.output.reason
          output_format: *tester-result

        - id: acceptance-gate
          depends_on: [acceptance-handoff]
          script: acceptance-gate
          runtime: bun
          with:
            last: $reset-round-evidence.output.last
          output_format:
            type: object
            properties:
              ready: { type: boolean }
              fix: { type: boolean }
              reasons: { type: string }
            required: [ready, fix, reasons]
            additionalProperties: false

        # The tester has read any retest reason; a stale one must not keep the
        # rounds going after the next fix.
        - id: clear-retest-reason
          depends_on: [acceptance-gate]
          when: "$acceptance-gate.output.fix == 'true'"
          script: clear-retest-reason
          runtime: bun

        - id: acceptance-fix
          depends_on: [clear-retest-reason]
          model: ['@implementor', large]
          context: { resume: session-report }
          command: acceptance-fix
          with:
            change_name: $INPUTS.change_name
            acceptance_round: $reset-round-evidence.output.round
            acceptance_fix_scope: $INPUTS.acceptance_fix_scope
            artifact_validation_instruction: $validate-inputs.output.artifact_validation_instruction
          output_format: *implementor-result

        - id: check-acceptance-progress
          depends_on: [acceptance-gate, acceptance-fix]
          trigger_rule: none_failed_min_one_success
          script: check-acceptance-progress
          runtime: bun
          with:
            fix: $acceptance-gate.output.fix
            blocked: { from: $acceptance-fix.output.blocked, if_skipped: "false" }
            reason: { from: $acceptance-fix.output.reason, if_skipped: "" }
          output_format:
            type: object
            properties:
              progressed: { type: boolean }
              push: { type: boolean }
            required: [progressed, push]
            additionalProperties: false

        - id: prepare-round-review
          depends_on: [check-acceptance-progress]
          when: "$validate-inputs.output.review == 'true' && $check-acceptance-progress.output.push == 'true'"
          script: prepare-review
          runtime: bun
          with: &acceptance-review
            place: acceptance
            mode: acceptance
            answers_file: ""
            start: ""
            change_dir: $validate-inputs.output.change_dir
            round: $reset-round-evidence.output.round
          output_format: *review-range

        - id: round-review
          depends_on: [prepare-round-review]
          when: "$validate-inputs.output.review == 'true' && $prepare-round-review.output.needed == 'true'"
          model: ['@reviewer', medium]
          context: fresh
          mutates_checkout: false
          command: review-change
          with:
            place: acceptance
            requested: ""
            feedback_revisions: ""
            change_dir: $validate-inputs.output.change_dir
            start: $prepare-round-review.output.start
            end: $prepare-round-review.output.end
            files: $prepare-round-review.output.files
            handed_off: $prepare-round-review.output.handed_off
          output_format: *review-output

        - id: record-round-review
          depends_on: [prepare-round-review, round-review]
          trigger_rule: none_failed_min_one_success
          when: "$validate-inputs.output.review == 'true' && $check-acceptance-progress.output.push == 'true'"
          script: record-review
          runtime: bun
          with:
            <<: *acceptance-review
            needed: $prepare-round-review.output.needed
            end: $prepare-round-review.output.end
            review_name: round-review
            result: { from: $round-review.output, if_skipped: "" }
          output_format: *review-settled

        - id: fix-round-findings
          depends_on: [record-round-review]
          when: "$validate-inputs.output.review == 'true' && $record-round-review.output.settled == 'false'"
          model: ['@implementor', large]
          context: { resume: acceptance-fix }
          command: fix-review-findings
          with:
            place: acceptance
            findings: $record-round-review.output.findings
          output_format: *implementor-result

        - id: record-round-fixes
          depends_on: [fix-round-findings]
          script: record-review-fixes
          runtime: bun
          with:
            place: acceptance
            review_name: fix-round-findings
            result: $fix-round-findings.output
          output_format: *review-fix-range

        - id: round-re-review
          depends_on: [record-round-fixes]
          when: "$record-round-fixes.output.blocked == 'false'"
          model: ['@reviewer', medium]
          context: { resume: round-review }
          mutates_checkout: false
          command: re-review
          with:
            place: acceptance
            change_dir: $validate-inputs.output.change_dir
            start: $record-round-fixes.output.start
            end: $record-round-fixes.output.end
            findings: $record-round-fixes.output.findings
          output_format: *review-output

        - id: end-round-review
          depends_on: [record-round-fixes, round-re-review]
          trigger_rule: none_failed_min_one_success
          script: end-review-round
          runtime: bun
          with:
            place: acceptance
            blocked: $record-round-fixes.output.blocked
            end: $record-round-fixes.output.end
            review_name: round-re-review
            result: { from: $round-re-review.output, if_skipped: "" }
          output_format: *review-stop

        - id: hand-off-round-review
          depends_on: [record-round-review, end-round-review]
          trigger_rule: none_failed_min_one_success
          when: "$validate-inputs.output.review == 'true' && $check-acceptance-progress.output.push == 'true'"
          script: hand-off-review
          runtime: bun
          with:
            place: acceptance
            change_dir: ""
          output_format: *review-handoff

        - id: acceptance-push
          depends_on: [check-acceptance-progress, hand-off-round-review]
          trigger_rule: none_failed_min_one_success
          when: "$check-acceptance-progress.output.push == 'true'"
          script: acceptance-push
          runtime: bun
          with:
            strict: false
            blocked: false
            reason: ""
          timeout: 2700000
          output_format: &acceptance-push-result
            type: object
            properties:
              ok: { type: boolean }
              problems: { type: string }
              person: { type: boolean }
            required: [ok, problems, person]
            additionalProperties: false

        - id: repair-acceptance-push
          depends_on: [acceptance-push]
          when: "$acceptance-push.output.ok == 'false' && $acceptance-push.output.person != 'true'"
          model: ['@implementor', large]
          context: { resume: acceptance-fix }
          command: repair-push
          with:
            change_name: $INPUTS.change_name
            pushed: the acceptance fixes
            problems: $acceptance-push.output.problems
          output_format: *implementor-result

        - id: recheck-acceptance-push
          depends_on: [repair-acceptance-push]
          script: acceptance-push
          runtime: bun
          with:
            strict: true
            on_failure: report
            blocked: $repair-acceptance-push.output.blocked
            reason: $repair-acceptance-push.output.reason
          timeout: 2700000
          output_format: *acceptance-push-result

        # The push does not change the pull request's draft state; a refusal by the forge
        # fails the run, since no agent can resolve it.
        - id: restore-draft-pr
          depends_on: [acceptance-push, recheck-acceptance-push]
          trigger_rule: none_failed_min_one_success
          when: "$acceptance-push.output.ok == 'true' || $recheck-acceptance-push.output.ok == 'true'"
          script: restore-draft-pr
          runtime: bun
          with:
            strict: true
            blocked: false
            reason: ""
          output_format: *check

        - id: verify-acceptance-pr
          depends_on: [restore-draft-pr]
          script: check-draft-pr
          runtime: bun
          with:
            push: false
            attempts: 10
            interval_seconds: 3
            strict: false
            blocked: false
            reason: ""
          output_format: *pr-check

        - id: repair-acceptance-pr
          depends_on: [verify-acceptance-pr]
          when: "$verify-acceptance-pr.output.ok == 'false'"
          model: ['@implementor', large]
          context: { resume: acceptance-fix }
          command: repair-acceptance-pr
          with:
            change_name: $INPUTS.change_name
            problems: $verify-acceptance-pr.output.problems
          output_format: *implementor-result

        - id: recheck-acceptance-pr
          depends_on: [repair-acceptance-pr]
          script: check-draft-pr
          runtime: bun
          timeout: 2700000
          with:
            push: true
            attempts: 10
            interval_seconds: 3
            strict: true
            blocked: $repair-acceptance-pr.output.blocked
            reason: $repair-acceptance-pr.output.reason
          output_format: *pr-check

  # Writes the status and the handoff and reads both back, failing the run when either
  # is wrong.
  - id: write-acceptance-status
    depends_on: [acceptance-rounds]
    script: write-acceptance-status
    runtime: bun
    with:
      rounds: $validate-inputs.output.rounds
    output_format:
      type: object
      properties:
        ready: { type: boolean }
        status: { type: string, enum: [ACCEPTANCE_COMPLETE, ACCEPTANCE_FAILED] }
        message: { type: string }
      required: [ready, status, message]
      additionalProperties: false

  # Before the stop point, so a run that stops after acceptance has it too: the implementor
  # reruns the checks of the rows still not verified and the workflow pushes its commit.
  - id: "list-unverified"
    depends_on: ["write-acceptance-status"]
    script: "finish"
    runtime: "bun"
    with: {"change_name":"$INPUTS.change_name","change_folder":"$validate-inputs.output.change_dir","blocked":false,"reason":"","result":"","previous":"","status":"","step":"list-unverified","previous_blocked":false,"op":"list-unverified"}
    output_format: {"type":"object","properties":{"rows":{"type":"string"}},"required":["rows"],"additionalProperties":false}

  - id: "recheck-unverified"
    depends_on: ["list-unverified"]
    when: "$list-unverified.output.rows != ''"
    model: ["@implementor","large"]
    context: {"resume":"session-report"}
    command: "recheck-unverified"
    with: {"change_name":"$INPUTS.change_name","change_dir":"$validate-inputs.output.change_dir","rows":"$list-unverified.output.rows"}
    output_format: *implementor-result

  - id: push-recheck
    depends_on: [list-unverified, recheck-unverified]
    trigger_rule: none_failed_min_one_success
    script: finish
    runtime: bun
    timeout: 2700000
    with: {"op":"push-recheck","strict":false}
    output_format: *check

  - id: repair-push-recheck
    depends_on: [push-recheck]
    when: "$push-recheck.output.ok == 'false'"
    model: ["@implementor","large"]
    context: {"resume":"session-report"}
    command: repair-push
    with: {"change_name":"$INPUTS.change_name","pushed":"the checklist recheck","problems":"$push-recheck.output.problems"}
    output_format: *implementor-result

  - id: recheck-push-recheck
    depends_on: [repair-push-recheck]
    script: finish
    runtime: bun
    timeout: 2700000
    with: {"op":"push-recheck","strict":true,"reason":"$repair-push-recheck.output.reason"}
    output_format: *check

  # Finish records reportable failures and continues to the review package. With stop_after:
  # acceptance it is skipped, and with it every step through the ranking.
  - id: review-rounds
    depends_on: [push-recheck, recheck-push-recheck]
    trigger_rule: none_failed_min_one_success
    when: "$validate-inputs.output.finish == 'true'"
    loop_group:
      max_iterations: 1
      on_exhausted: complete
      until_bash: '[ -f "$ARTIFACTS_DIR/review/outcome.json" ]'
      nodes:
      - id: start-round
        script: finish
        runtime: bun
        with: {"op":"start-round","change_name":"$INPUTS.change_name","change_folder":"$validate-inputs.output.change_dir","answer":"$LOOP_PREV.wait-for-review.output.text"}
        output_format: {"type":"object","properties":{"round":{"type":"integer"},"mode":{"type":"string"},"reason":{"type":"string"},"change_folder":{"type":"string"},"archive_needed":{"type":"boolean"},"retest":{"type":"boolean"},"journeys":{"type":"string"},"answers_file":{"type":"string"},"review_head":{"type":"string"},"work":{"type":"boolean"},"publish":{"type":"boolean"}},"required":["round","mode","reason","change_folder","archive_needed","retest","journeys","answers_file","review_head","work","publish"],"additionalProperties":false}

      - id: merge-base
        depends_on: ["start-round"]
        trigger_rule: none_failed_min_one_success
        when: "$start-round.output.work == 'true'"
        script: finish
        runtime: bun
        with: {"op":"merge-base"}
        output_format: {"type":"object","properties":{"ok":{"type":"boolean"},"problems":{"type":"string"},"conflict":{"type":"boolean"}},"required":["ok","problems","conflict"],"additionalProperties":false}

      - id: resolve-merge
        depends_on: ["merge-base"]
        trigger_rule: none_failed_min_one_success
        when: "$start-round.output.work == 'true' && $merge-base.output.conflict == 'true'"
        model: ["@implementor","large"]
        context: {"resume":"session-report"}
        command: resolve-merge
        with: {"change_dir":"$start-round.output.change_folder","problems":"$merge-base.output.problems"}
        output_format: *implementor-result

      - id: finish-merge
        depends_on: ["resolve-merge"]
        trigger_rule: none_failed_min_one_success
        when: "$start-round.output.work == 'true'"
        script: finish
        runtime: bun
        with: {"op":"finish-merge","blocked":"$resolve-merge.output.blocked","reason":"$resolve-merge.output.reason"}
        output_format: *check

      - id: address-feedback
        depends_on: ["merge-base","finish-merge"]
        trigger_rule: none_failed_min_one_success
        when: "$start-round.output.work == 'true' && $merge-base.output.ok == 'true' || $start-round.output.work == 'true' && $merge-base.output.conflict == 'true' && $finish-merge.output.ok == 'true'"
        model: ["@implementor","large"]
        context: {"resume":"session-report"}
        command: address-feedback
        with: {"change_dir":"$start-round.output.change_folder","archive_needed":"$start-round.output.archive_needed","answers_file":"$start-round.output.answers_file","mode":"$start-round.output.mode","review_round":"$start-round.output.round"}
        output_format: *implementor-result

      - id: check-response
        depends_on: ["address-feedback"]
        trigger_rule: none_failed_min_one_success
        when: "$start-round.output.work == 'true'"
        script: finish
        runtime: bun
        with: {"op":"check-response","blocked":"$address-feedback.output.blocked","reason":"$address-feedback.output.reason","round":"$start-round.output.round"}
        output_format: *check

      - id: prepare-feedback-review
        depends_on: [check-response]
        trigger_rule: none_failed_min_one_success
        when: "$validate-inputs.output.review == 'true' && $start-round.output.work == 'true'"
        script: prepare-review
        runtime: bun
        with: &feedback-review
          place: feedback
          mode: feedback
          start: $start-round.output.review_head
          change_dir: $start-round.output.change_folder
          round: $start-round.output.round
          answers_file: $start-round.output.answers_file
        output_format: *review-range

      - id: feedback-review
        depends_on: [prepare-feedback-review]
        trigger_rule: none_failed_min_one_success
        when: "$validate-inputs.output.review == 'true' && $prepare-feedback-review.output.needed == 'true'"
        model: ['@reviewer', medium]
        context: fresh
        mutates_checkout: false
        command: review-change
        with:
          place: feedback
          requested: $prepare-feedback-review.output.findings
          feedback_revisions: $prepare-feedback-review.output.revisions
          change_dir: $start-round.output.change_folder
          start: $prepare-feedback-review.output.start
          end: $prepare-feedback-review.output.end
          files: $prepare-feedback-review.output.files
          handed_off: $prepare-feedback-review.output.handed_off
        output_format: *review-output

      - id: record-feedback-review
        depends_on: [prepare-feedback-review, feedback-review]
        trigger_rule: none_failed_min_one_success
        when: "$validate-inputs.output.review == 'true' && $start-round.output.work == 'true'"
        script: record-review
        runtime: bun
        with:
          <<: *feedback-review
          needed: $prepare-feedback-review.output.needed
          end: $prepare-feedback-review.output.end
          review_name: feedback-review
          result: { from: $feedback-review.output, if_skipped: "" }
        output_format: *review-settled

      - id: fix-feedback-findings
        depends_on: [record-feedback-review]
        trigger_rule: none_failed_min_one_success
        when: "$validate-inputs.output.review == 'true' && $record-feedback-review.output.settled == 'false'"
        model: ['@implementor', large]
        context: { resume: session-report }
        command: fix-review-findings
        with:
          place: feedback
          findings: $record-feedback-review.output.findings
        output_format: *implementor-result

      - id: record-feedback-fixes
        depends_on: [fix-feedback-findings]
        trigger_rule: none_failed_min_one_success
        script: record-review-fixes
        runtime: bun
        with:
          place: feedback
          review_name: fix-feedback-findings
          result: $fix-feedback-findings.output
        output_format: *review-fix-range

      - id: feedback-re-review
        depends_on: [record-feedback-fixes]
        trigger_rule: none_failed_min_one_success
        when: "$record-feedback-fixes.output.blocked == 'false'"
        model: ['@reviewer', medium]
        context: { resume: feedback-review }
        mutates_checkout: false
        command: re-review
        with:
          place: feedback
          change_dir: $start-round.output.change_folder
          start: $record-feedback-fixes.output.start
          end: $record-feedback-fixes.output.end
          findings: $record-feedback-fixes.output.findings
        output_format: *review-output

      - id: end-feedback-review
        depends_on: [record-feedback-fixes, feedback-re-review]
        trigger_rule: none_failed_min_one_success
        script: end-review-round
        runtime: bun
        with:
          place: feedback
          blocked: $record-feedback-fixes.output.blocked
          end: $record-feedback-fixes.output.end
          review_name: feedback-re-review
          result: { from: $feedback-re-review.output, if_skipped: "" }
        output_format: *review-stop

      - id: hand-off-feedback-review
        depends_on: [record-feedback-review, end-feedback-review]
        trigger_rule: none_failed_min_one_success
        when: "$validate-inputs.output.review == 'true' && $start-round.output.work == 'true'"
        script: hand-off-review
        runtime: bun
        with:
          place: feedback
          change_dir: $start-round.output.change_folder
        output_format: *review-handoff

      - id: push-round
        depends_on: ["check-response","hand-off-feedback-review"]
        trigger_rule: none_failed_min_one_success
        when: "$start-round.output.work == 'true'"
        script: finish
        runtime: bun
        timeout: 2700000
        with: {"op":"push-round"}
        output_format: *check

      - id: repair-push-round
        depends_on: ["push-round"]
        trigger_rule: none_failed_min_one_success
        when: "$start-round.output.work == 'true' && $push-round.output.ok == 'false'"
        model: ["@implementor","large"]
        context: {"resume":"session-report"}
        command: repair-push
        with: {"change_name":"$INPUTS.change_name","change_dir":"$start-round.output.change_folder","pushed":"the review feedback","problems":"$push-round.output.problems"}
        output_format: *implementor-result

      - id: recheck-push-round
        depends_on: ["repair-push-round"]
        trigger_rule: all_success
        when: "$start-round.output.work == 'true'"
        script: finish
        runtime: bun
        timeout: 2700000
        with: {"strict":true,"op":"push-round","blocked":"$repair-push-round.output.blocked","reason":"$repair-push-round.output.reason"}
        output_format: *check

      - id: prepare-retest
        depends_on: ["push-round","recheck-push-round"]
        trigger_rule: none_failed_min_one_success
        when: "$start-round.output.work == 'true' && $start-round.output.retest == 'true'"
        script: prepare-retest
        runtime: bun
        with: {"review_round":"$start-round.output.round"}
        output_format: {"type":"object","properties":{"round":{"type":"integer"}},"required":["round"],"additionalProperties":false}

      - id: retest-journeys
        depends_on: ["prepare-retest"]
        trigger_rule: none_failed_min_one_success
        when: "$start-round.output.work == 'true' && $start-round.output.retest == 'true'"
        model: ["@tester","medium"]
        context: fresh
        command: acceptance-test
        with: {"change_name":"$INPUTS.change_name","change_dir":"$start-round.output.change_folder","acceptance_round":"$prepare-retest.output.round","acceptance_rounds":"$prepare-retest.output.round","journeys":"$start-round.output.journeys"}
        output_format: *tester-result

      - id: wait-retest-ci
        depends_on: ["retest-journeys"]
        trigger_rule: none_failed_min_one_success
        when: "$start-round.output.work == 'true' && $start-round.output.retest == 'true' && $retest-journeys.output.ready == 'true'"
        timeout: 1200000
        script: wait-ci
        runtime: bun
        with: {"round":"$prepare-retest.output.round","max_minutes":15,"interval_seconds":30}
        output_format: {"type":"object","properties":{"status":{"type":"string"},"had_checks":{"type":"boolean"},"head_moved":{"type":"boolean"},"report":{"type":"string"}},"required":["status","had_checks","head_moved","report"],"additionalProperties":false}

      - id: handoff-retest
        depends_on: ["retest-journeys","wait-retest-ci"]
        trigger_rule: none_failed_min_one_success
        when: "$start-round.output.work == 'true' && $start-round.output.retest == 'true'"
        model: ["@tester","medium"]
        context: {"resume":"retest-journeys"}
        command: acceptance-handoff
        with: {"ci_status":{"from":"$wait-retest-ci.output.status","if_skipped":"not run"},"ci_report":{"from":"$wait-retest-ci.output.report","if_skipped":"none"},"ci_reason":"$retest-journeys.output.reason"}
        output_format: *tester-result

      - id: gate-retest
        depends_on: ["handoff-retest"]
        trigger_rule: none_failed_min_one_success
        when: "$start-round.output.work == 'true' && $start-round.output.retest == 'true'"
        script: acceptance-gate
        runtime: bun
        with: {"last":true}
        output_format: {"type":"object","properties":{"ready":{"type":"boolean"},"fix":{"type":"boolean"},"reasons":{"type":"string"}},"required":["ready","fix","reasons"],"additionalProperties":false}

      - id: record-retest
        depends_on: ["gate-retest"]
        trigger_rule: none_failed_min_one_success
        when: "$start-round.output.work == 'true' && $start-round.output.retest == 'true'"
        script: finish
        runtime: bun
        with: {"op":"record-retest","round":"$start-round.output.round","status":"$gate-retest.output.ready","reason":"$gate-retest.output.reasons"}
        output_format: *check

      - id: "commit-logs"
        when: "$start-round.output.mode == 'first' && $start-round.output.archive_needed == 'true'"
        depends_on: [start-round]
        trigger_rule: none_failed_min_one_success
        script: "finish"
        runtime: "bun"
        timeout: 1200000
        with: {"change_name":"$INPUTS.change_name","change_folder":"$start-round.output.change_folder","blocked":false,"reason":"","result":"","previous":"","status":"","step":"commit-logs","previous_blocked":false,"op":"commit-logs"}
        output_format: {"type":"object","properties":{"ok":{"type":"boolean"},"problems":{"type":"string"}},"required":["ok","problems"],"additionalProperties":false}

      - id: "archive-change"
        when: "$start-round.output.publish == 'true' && $start-round.output.archive_needed == 'true'"
        depends_on: [start-round, commit-logs, push-round, recheck-push-round, record-retest]
        trigger_rule: none_failed_min_one_success
        script: "finish"
        runtime: "bun"
        timeout: 1200000
        with: {"change_name":"$INPUTS.change_name","change_folder":"$start-round.output.change_folder","blocked":false,"reason":"","result":"","previous":"","status":"","step":"archive-change","previous_blocked":false,"op":"archive-change","round":"$start-round.output.round"}
        output_format: {"type":"object","properties":{"ok":{"type":"boolean"},"problems":{"type":"string"}},"required":["ok","problems"],"additionalProperties":false}

      - id: "repair-archive-delta"
        depends_on: ["archive-change"]
        trigger_rule: none_failed_min_one_success
        model: ["@implementor","large"]
        context: {"resume":"session-report"}
        command: "repair-archive-delta"
        with: {"change_name":"$INPUTS.change_name","change_dir":"$start-round.output.change_folder","problems":"$archive-change.output.problems","answers_file":"$start-round.output.answers_file"}
        when: "$start-round.output.publish == 'true' && $start-round.output.archive_needed == 'true' && $archive-change.output.ok == 'false'"

        output_format: *implementor-result

      - id: "rearchive-change"
        depends_on: ["repair-archive-delta"]
        trigger_rule: none_failed_min_one_success
        script: "finish"
        runtime: "bun"
        timeout: 1200000
        with: {"change_name":"$INPUTS.change_name","change_folder":"$start-round.output.change_folder","blocked":"$repair-archive-delta.output.blocked","reason":"$repair-archive-delta.output.reason","result":"","previous":"","status":"","step":"rearchive-change","previous_blocked":false,"op":"archive-change"}
        when: "$start-round.output.publish == 'true' && $start-round.output.archive_needed == 'true' && $archive-change.output.ok == 'false'"
        output_format: {"type":"object","properties":{"ok":{"type":"boolean"},"problems":{"type":"string"}},"required":["ok","problems"],"additionalProperties":false}

      - id: "verify-archive-commit"
        depends_on: ["archive-change","rearchive-change"]
        trigger_rule: none_failed_min_one_success
        script: "finish"
        runtime: "bun"
        timeout: 1200000
        with: {"change_name":"$INPUTS.change_name","change_folder":"$start-round.output.change_folder","blocked":false,"reason":"","result":"","previous":"","status":"","step":"verify-archive-commit","previous_blocked":false,"op":"verify-archive-commit"}
        when: "$start-round.output.publish == 'true' && $start-round.output.archive_needed == 'true' && $archive-change.output.ok == 'true' || $start-round.output.publish == 'true' && $start-round.output.archive_needed == 'true' && $rearchive-change.output.ok == 'true'"
        output_format: {"type":"object","properties":{"ok":{"type":"boolean"},"problems":{"type":"string"},"archive_state":{"type":"string"}},"required":["ok","problems","archive_state"],"additionalProperties":false}

      - id: "repair-archive-commit"
        depends_on: ["verify-archive-commit"]
        trigger_rule: none_failed_min_one_success
        model: ["@implementor","large"]
        context: {"resume":"session-report"}
        command: "repair-archive-commit"
        with: {"change_name":"$INPUTS.change_name","change_dir":"$start-round.output.change_folder","archive_state":"$verify-archive-commit.output.archive_state","problems":"$verify-archive-commit.output.problems"}
        when: "$start-round.output.publish == 'true' && $start-round.output.archive_needed == 'true' && $verify-archive-commit.output.ok == 'false'"

        output_format: *implementor-result

      - id: "recheck-archive-commit"
        depends_on: ["repair-archive-commit"]
        trigger_rule: none_failed_min_one_success
        script: "finish"
        runtime: "bun"
        timeout: 1200000
        with: {"change_name":"$INPUTS.change_name","change_folder":"$start-round.output.change_folder","blocked":"$repair-archive-commit.output.blocked","reason":"$repair-archive-commit.output.reason","result":"","previous":"","status":"","step":"recheck-archive-commit","previous_blocked":false,"op":"verify-archive-commit"}
        when: "$start-round.output.publish == 'true' && $start-round.output.archive_needed == 'true' && $verify-archive-commit.output.ok == 'false'"
        output_format: {"type":"object","properties":{"ok":{"type":"boolean"},"problems":{"type":"string"},"archive_state":{"type":"string"}},"required":["ok","problems","archive_state"],"additionalProperties":false}

      - id: "record-archive"
        when: "$start-round.output.publish == 'true'"
        depends_on: [start-round, "archive-change","rearchive-change","verify-archive-commit","recheck-archive-commit"]
        trigger_rule: none_failed_min_one_success
        script: "finish"
        runtime: "bun"
        timeout: 1200000
        with: {"change_name":"$INPUTS.change_name","change_folder":"$start-round.output.change_folder","blocked":{"from":"$repair-archive-commit.output.blocked","if_skipped":false},"reason":{"from":"$repair-archive-commit.output.reason","if_skipped":"Archive delta repair blocked; see archive report and decision log."},"result":"","previous":"","status":"","step":"record-archive","previous_blocked":{"from":"$repair-archive-delta.output.blocked","if_skipped":false},"op":"record-archive","archive_needed":"$start-round.output.archive_needed"}
        output_format: {"type":"object","properties":{"change_folder":{"type":"string"}},"required":["change_folder"],"additionalProperties":false}

      - id: sync-logs
        depends_on: [record-archive]
        when: "$start-round.output.work == 'true'"
        script: finish
        runtime: bun
        with: {"op":"sync-logs","change_name":"$INPUTS.change_name","change_folder":"$record-archive.output.change_folder"}
        output_format: *check

      - id: "finalize-push"
        depends_on: [record-archive, sync-logs]
        trigger_rule: none_failed_min_one_success
        script: "finish"
        runtime: "bun"
        timeout: 2700000
        with: {"change_name":"$INPUTS.change_name","change_folder":"$record-archive.output.change_folder","blocked":false,"reason":"","result":"the logs and the archive","previous":"","status":"","step":"finalize-push","previous_blocked":false,"op":"finalize-push"}
        output_format: {"type":"object","properties":{"ok":{"type":"boolean"},"problems":{"type":"string"}},"required":["ok","problems"],"additionalProperties":false}

      - id: "repair-finalize-push"
        depends_on: ["finalize-push"]
        trigger_rule: none_failed_min_one_success
        model: ["@implementor","large"]
        context: {"resume":"session-report"}
        command: "repair-push"
        with: {"change_name":"$INPUTS.change_name","change_dir":"$record-archive.output.change_folder","pushed":"the logs and the archive","problems":"$finalize-push.output.problems"}
        when: "$start-round.output.publish == 'true' && $finalize-push.output.ok == 'false'"

        output_format: *implementor-result

      - id: "recheck-finalize-push"
        depends_on: ["repair-finalize-push"]
        trigger_rule: none_failed_min_one_success
        script: "finish"
        runtime: "bun"
        timeout: 2700000
        with: {"strict":true,"change_name":"$INPUTS.change_name","change_folder":"$record-archive.output.change_folder","blocked":"$repair-finalize-push.output.blocked","reason":"$repair-finalize-push.output.reason","result":"the logs and the archive","previous":"","status":"","step":"finalize-push","previous_blocked":false,"op":"finalize-push"}
        when: "$start-round.output.publish == 'true' && $finalize-push.output.ok == 'false'"
        output_format: {"type":"object","properties":{"ok":{"type":"boolean"},"problems":{"type":"string"}},"required":["ok","problems"],"additionalProperties":false}

      - id: "mark-ready"
        depends_on: ["finalize-push","recheck-finalize-push"]
        trigger_rule: none_failed_min_one_success
        script: "finish"
        runtime: "bun"
        timeout: 1200000
        with: {"change_name":"$INPUTS.change_name","change_folder":"$record-archive.output.change_folder","blocked":false,"reason":"","result":"","previous":"","status":"","step":"mark-ready","previous_blocked":false,"op":"mark-ready"}
        when: "$start-round.output.publish == 'true' && $finalize-push.output.ok == 'true' || $start-round.output.publish == 'true' && $recheck-finalize-push.output.ok == 'true'"
        output_format: {"type":"object","properties":{"ok":{"type":"boolean"},"problems":{"type":"string"}},"required":["ok","problems"],"additionalProperties":false}

      - id: ci-cycles
        depends_on: [mark-ready]
        when: "$start-round.output.publish == 'true' && $mark-ready.output.ok == 'true'"
        loop_group:
          max_iterations: 3
          on_exhausted: complete
          until_bash: 'done=$end-ci-cycle.output.done; [ "$done" = true ]'
          nodes:
            - id: "wait-finalize-ci"
              depends_on: []
              trigger_rule: "none_failed_min_one_success"
              script: "finish"
              runtime: "bun"
              timeout: 1200000
              with: {"change_name":"$INPUTS.change_name","change_folder":"$record-archive.output.change_folder","blocked":false,"reason":"","result":"","previous":"$LOOP_PREV.end-ci-cycle.output.cycle","status":"","step":"wait-finalize-ci","previous_blocked":"$LOOP_PREV.fix-pr.output.blocked","op":"wait-finalize-ci"}
              output_format: {"type":"object","properties":{"status":{"type":"string"},"had_checks":{"type":"boolean"},"head_moved":{"type":"boolean"},"report":{"type":"string"},"ci_report":{"type":"string"},"cycle":{"type":"integer"}},"required":["status","had_checks","head_moved","report","ci_report","cycle"],"additionalProperties":false}

            - id: "repair-ci-wait"
              depends_on: ["wait-finalize-ci"]
              trigger_rule: "all_success"
              model: ["@implementor","large"]
              context: {"resume":"session-report"}
              command: "repair-ci-wait"
              with: {"change_name":"$INPUTS.change_name","change_dir":"$record-archive.output.change_folder","problems":"$wait-finalize-ci.output.ci_report"}
              when: "$wait-finalize-ci.output.status == 'error'"

              output_format: *implementor-result

            - id: "mark-ready-after-repair"
              depends_on: ["repair-ci-wait"]
              trigger_rule: "all_success"
              script: "finish"
              runtime: "bun"
              timeout: 2700000
              with: {"push":true,"change_name":"$INPUTS.change_name","change_folder":"$record-archive.output.change_folder","blocked":"$repair-ci-wait.output.blocked","reason":"$repair-ci-wait.output.reason","result":"","previous":"","status":"","step":"mark-ready-after-repair","previous_blocked":false,"op":"mark-ready"}
              when: "$wait-finalize-ci.output.status == 'error'"
              output_format: {"type":"object","properties":{"ok":{"type":"boolean"},"problems":{"type":"string"}},"required":["ok","problems"],"additionalProperties":false}

            - id: "rewait-finalize-ci"
              depends_on: ["mark-ready-after-repair"]
              trigger_rule: "all_success"
              script: "finish"
              runtime: "bun"
              timeout: 1200000
              with: {"change_name":"$INPUTS.change_name","change_folder":"$record-archive.output.change_folder","blocked":"$repair-ci-wait.output.blocked","reason":"$repair-ci-wait.output.reason","result":"","previous":"$LOOP_PREV.end-ci-cycle.output.cycle","status":"","step":"wait-finalize-ci","previous_blocked":false,"op":"wait-finalize-ci"}
              when: "$wait-finalize-ci.output.status == 'error'"
              output_format: {"type":"object","properties":{"status":{"type":"string"},"had_checks":{"type":"boolean"},"head_moved":{"type":"boolean"},"report":{"type":"string"},"ci_report":{"type":"string"},"cycle":{"type":"integer"}},"required":["status","had_checks","head_moved","report","ci_report","cycle"],"additionalProperties":false}

            - id: "ci-cycle-status"
              depends_on: ["wait-finalize-ci","rewait-finalize-ci"]
              trigger_rule: "none_failed_min_one_success"
              script: "finish"
              runtime: "bun"
              timeout: 1200000
              with: {"change_name":"$INPUTS.change_name","change_folder":"$record-archive.output.change_folder","blocked":{"from":"$repair-ci-wait.output.blocked","if_skipped":false},"reason":"","result":"","previous":"$LOOP_PREV.end-ci-cycle.output.cycle","status":"","step":"ci-cycle-status","previous_blocked":false,"op":"ci-cycle-status"}
              output_format: {"type":"object","properties":{"done":{"type":"boolean"},"fix":{"type":"boolean"},"cycle":{"type":"integer"},"ci_report":{"type":"string"}},"required":["done","fix","cycle","ci_report"],"additionalProperties":false}

            - id: "fix-pr"
              depends_on: ["ci-cycle-status"]
              trigger_rule: "none_failed_min_one_success"
              model: ["@implementor","large"]
              context: {"resume":"session-report"}
              command: "fix-pr"
              with: {"change_name":"$INPUTS.change_name","change_dir":"$record-archive.output.change_folder","ci_report":"$ci-cycle-status.output.ci_report","change_folder":"$record-archive.output.change_folder"}
              when: "$ci-cycle-status.output.fix == 'true'"

              output_format: *implementor-result

            - id: "push-ci-fix"
              when: "$ci-cycle-status.output.fix == 'true'"
              depends_on: ["fix-pr"]
              script: "finish"
              runtime: "bun"
              timeout: 2700000
              with: {"change_name":"$INPUTS.change_name","change_folder":"$record-archive.output.change_folder","blocked":"$fix-pr.output.blocked","reason":"$fix-pr.output.reason","result":"the CI fixes","previous":"","status":"","step":"push-ci-fix","previous_blocked":false,"op":"finalize-push"}
              output_format: {"type":"object","properties":{"ok":{"type":"boolean"},"problems":{"type":"string"}},"required":["ok","problems"],"additionalProperties":false}

            - id: "repair-push-ci-fix"
              depends_on: ["push-ci-fix"]
              trigger_rule: "all_success"
              model: ["@implementor","large"]
              context: {"resume":"session-report"}
              command: "repair-push"
              with: {"change_name":"$INPUTS.change_name","change_dir":"$record-archive.output.change_folder","pushed":"the CI fixes","problems":"$push-ci-fix.output.problems"}
              when: "$push-ci-fix.output.ok == 'false'"

              output_format: *implementor-result

            - id: "recheck-push-ci-fix"
              depends_on: ["repair-push-ci-fix"]
              trigger_rule: "all_success"
              script: "finish"
              runtime: "bun"
              timeout: 2700000
              with: {"strict":true,"change_name":"$INPUTS.change_name","change_folder":"$record-archive.output.change_folder","blocked":"$repair-push-ci-fix.output.blocked","reason":"$repair-push-ci-fix.output.reason","result":"the CI fixes","previous":"","status":"","step":"push-ci-fix","previous_blocked":false,"op":"finalize-push"}
              when: "$push-ci-fix.output.ok == 'false'"
              output_format: {"type":"object","properties":{"ok":{"type":"boolean"},"problems":{"type":"string"}},"required":["ok","problems"],"additionalProperties":false}

            - id: end-ci-cycle
              depends_on: [ci-cycle-status, fix-pr, push-ci-fix, recheck-push-ci-fix]
              trigger_rule: none_failed_min_one_success
              script: finish
              runtime: bun
              with: {"change_name":"$INPUTS.change_name","change_folder":"$record-archive.output.change_folder","blocked":false,"reason":"","result":"","previous":"$LOOP_PREV.end-ci-cycle.output.cycle","status":"","step":"end-ci-cycle","previous_blocked":false,"op":"end-ci-cycle"}
              output_format: {"type":"object","properties":{"done":{"type":"boolean"},"fix":{"type":"boolean"},"cycle":{"type":"integer"}},"required":["done","fix","cycle"],"additionalProperties":false}

      - id: "final-ci"
        depends_on: ["mark-ready","ci-cycles"]
        trigger_rule: none_failed_min_one_success
        script: "finish"
        runtime: "bun"
        timeout: 1200000
        with: {"change_name":"$INPUTS.change_name","change_folder":"$record-archive.output.change_folder","blocked":false,"reason":"","result":"","previous":"","status":"","step":"final-ci","previous_blocked":false,"op":"final-ci"}
        when: "$start-round.output.publish == 'true' && $mark-ready.output.ok == 'true'"
        output_format: {"type":"object","properties":{"status":{"type":"string"},"had_checks":{"type":"boolean"},"head_moved":{"type":"boolean"},"report":{"type":"string"},"ci_report":{"type":"string"},"cycle":{"type":"integer"}},"required":["status","had_checks","head_moved","report","ci_report","cycle"],"additionalProperties":false}

      - id: "repair-final-wait"
        depends_on: ["final-ci"]
        trigger_rule: none_failed_min_one_success
        model: ["@implementor","large"]
        context: {"resume":"session-report"}
        command: "repair-ci-wait"
        with: {"change_name":"$INPUTS.change_name","change_dir":"$record-archive.output.change_folder","problems":"$final-ci.output.ci_report"}
        when: "$start-round.output.publish == 'true' && $final-ci.output.status == 'error'"

        output_format: *implementor-result

      - id: "mark-ready-after-final-repair"
        depends_on: ["repair-final-wait"]
        trigger_rule: none_failed_min_one_success
        script: "finish"
        runtime: "bun"
        timeout: 2700000
        with: {"push":true,"change_name":"$INPUTS.change_name","change_folder":"$record-archive.output.change_folder","blocked":"$repair-final-wait.output.blocked","reason":"$repair-final-wait.output.reason","result":"","previous":"","status":"","step":"mark-ready-after-final-repair","previous_blocked":false,"op":"mark-ready"}
        when: "$start-round.output.publish == 'true' && $final-ci.output.status == 'error'"
        output_format: {"type":"object","properties":{"ok":{"type":"boolean"},"problems":{"type":"string"}},"required":["ok","problems"],"additionalProperties":false}

      - id: "recheck-final-ci"
        depends_on: ["mark-ready-after-final-repair"]
        trigger_rule: none_failed_min_one_success
        script: "finish"
        runtime: "bun"
        timeout: 1200000
        with: {"change_name":"$INPUTS.change_name","change_folder":"$record-archive.output.change_folder","blocked":"$repair-final-wait.output.blocked","reason":"$repair-final-wait.output.reason","result":"","previous":"","status":"","step":"final-ci","previous_blocked":false,"op":"final-ci"}
        when: "$start-round.output.publish == 'true' && $final-ci.output.status == 'error'"
        output_format: {"type":"object","properties":{"status":{"type":"string"},"had_checks":{"type":"boolean"},"head_moved":{"type":"boolean"},"report":{"type":"string"},"ci_report":{"type":"string"},"cycle":{"type":"integer"}},"required":["status","had_checks","head_moved","report","ci_report","cycle"],"additionalProperties":false}

      - id: "record-finalize"
        when: "$start-round.output.publish == 'true'"
        depends_on: ["record-archive","final-ci","recheck-final-ci","mark-ready"]
        trigger_rule: none_failed_min_one_success
        script: "finish"
        runtime: "bun"
        timeout: 1200000
        with: {"change_name":"$INPUTS.change_name","change_folder":"$record-archive.output.change_folder","blocked":false,"reason":"","result":"","previous":"","status":"","step":"record-finalize","previous_blocked":false,"op":"record-finalize"}
        output_format: {"type":"object","properties":{"ok":{"type":"boolean"},"problems":{"type":"string"}},"required":["ok","problems"],"additionalProperties":false}

      - id: "prepare-ranking"
        when: "$start-round.output.publish == 'true'"
        depends_on: ["record-finalize"]
        trigger_rule: none_failed_min_one_success
        script: "finish"
        runtime: "bun"
        timeout: 1440000
        with: {"change_name":"$INPUTS.change_name","change_folder":"$record-archive.output.change_folder","blocked":false,"reason":"","result":"","previous":"","status":"","step":"prepare-ranking","previous_blocked":false,"op":"prepare-ranking"}
        output_format: {"type":"object","properties":{"accepted_head":{"type":"string"},"later_commits":{"type":"string"}},"required":["accepted_head","later_commits"],"additionalProperties":false}

      - id: "rank-review"
        when: "$start-round.output.publish == 'true'"
        trigger_rule: none_failed_min_one_success
        depends_on: ["prepare-ranking"]
        model: ["@reviewer","medium"]
        context: "fresh"
        mutates_checkout: false
        command: "rank-review"
        with: {"change_folder":"$record-archive.output.change_folder","accepted_head":"$prepare-ranking.output.accepted_head","later_commits":"$prepare-ranking.output.later_commits","answers_file":"$start-round.output.answers_file","review_round":"$start-round.output.round"}

        output_format: &ranking
          {"type":"object","properties":{"red":{"type":"array","items":{"type":"object","properties":{"type":{"type":"string"},"title":{"type":"string"},"detail":{"type":"string"},"source":{"type":"array","items":{"type":"string"}},"questions":{"type":"array","items":{"type":"object","properties":{"prompt":{"type":"string"},"options":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"label":{"type":"string"},"detail":{"type":"string"}},"required":["id","label","detail"],"additionalProperties":false}}},"required":["prompt","options"],"additionalProperties":false}},"journeys":{"type":"array","items":{"type":"object","properties":{"code":{"type":"string"},"title":{"type":"string"},"commit":{"type":"string"}},"required":["code","title","commit"],"additionalProperties":false}},"links":{"type":"array","items":{"type":"object","properties":{"label":{"type":"string"},"target":{"type":"string"}},"required":["label","target"],"additionalProperties":false}},"evidence":{"type":"string"}},"required":["type","title","detail","source","questions","journeys","links","evidence"],"additionalProperties":false}},"orange":{"type":"array","items":{"type":"object","properties":{"type":{"type":"string"},"title":{"type":"string"},"detail":{"type":"string"},"source":{"type":"array","items":{"type":"string"}},"questions":{"type":"array","items":{"type":"object","properties":{"prompt":{"type":"string"},"options":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"label":{"type":"string"},"detail":{"type":"string"}},"required":["id","label","detail"],"additionalProperties":false}}},"required":["prompt","options"],"additionalProperties":false}},"journeys":{"type":"array","items":{"type":"object","properties":{"code":{"type":"string"},"title":{"type":"string"},"commit":{"type":"string"}},"required":["code","title","commit"],"additionalProperties":false}},"links":{"type":"array","items":{"type":"object","properties":{"label":{"type":"string"},"target":{"type":"string"}},"required":["label","target"],"additionalProperties":false}},"evidence":{"type":"string"}},"required":["type","title","detail","source","questions","journeys","links","evidence"],"additionalProperties":false}},"yellow":{"type":"array","items":{"type":"object","properties":{"type":{"type":"string"},"title":{"type":"string"},"detail":{"type":"string"},"source":{"type":"array","items":{"type":"string"}},"questions":{"type":"array","items":{"type":"object","properties":{"prompt":{"type":"string"},"options":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"label":{"type":"string"},"detail":{"type":"string"}},"required":["id","label","detail"],"additionalProperties":false}}},"required":["prompt","options"],"additionalProperties":false}},"journeys":{"type":"array","items":{"type":"object","properties":{"code":{"type":"string"},"title":{"type":"string"},"commit":{"type":"string"}},"required":["code","title","commit"],"additionalProperties":false}},"links":{"type":"array","items":{"type":"object","properties":{"label":{"type":"string"},"target":{"type":"string"}},"required":["label","target"],"additionalProperties":false}},"evidence":{"type":"string"}},"required":["type","title","detail","source","questions","journeys","links","evidence"],"additionalProperties":false}},"evidence":{"type":"string"},"keyEvidence":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"title":{"type":"string"},"shows":{"type":"string"}},"required":["file","title","shows"],"additionalProperties":false}}},"required":["red","orange","yellow","evidence","keyEvidence"],"additionalProperties":false}

      - id: "check-ranking"
        when: "$start-round.output.publish == 'true'"
        depends_on: ["rank-review"]
        trigger_rule: none_failed_min_one_success
        script: "finish"
        runtime: "bun"
        timeout: 1200000
        with: {"change_name":"$INPUTS.change_name","change_folder":"$record-archive.output.change_folder","blocked":false,"reason":"","result":"$rank-review.output","previous":"","status":"","step":"check-ranking","previous_blocked":false,"op":"check-ranking"}
        output_format: {"type":"object","properties":{"ok":{"type":"boolean"},"problems":{"type":"string"}},"required":["ok","problems"],"additionalProperties":false}

      - id: "repair-ranking"
        depends_on: ["check-ranking"]
        trigger_rule: none_failed_min_one_success
        model: ["@reviewer","medium"]
        context: {"resume":"rank-review"}
        command: "repair-ranking"
        with: {"change_name":"$INPUTS.change_name","change_dir":"$record-archive.output.change_folder","problems":"$check-ranking.output.problems"}
        when: "$start-round.output.publish == 'true' && $check-ranking.output.ok == 'false'"

        output_format: *ranking

      - id: "recheck-ranking"
        depends_on: ["repair-ranking"]
        trigger_rule: none_failed_min_one_success
        script: "finish"
        runtime: "bun"
        timeout: 1200000
        with: {"change_name":"$INPUTS.change_name","change_folder":"$record-archive.output.change_folder","blocked":false,"reason":"","result":"$repair-ranking.output","previous":"","status":"","step":"recheck-ranking","previous_blocked":false,"op":"check-ranking"}
        when: "$start-round.output.publish == 'true' && $check-ranking.output.ok == 'false'"
        output_format: {"type":"object","properties":{"ok":{"type":"boolean"},"problems":{"type":"string"}},"required":["ok","problems"],"additionalProperties":false}

      - id: "place-ranking"
        depends_on: ["recheck-ranking"]
        trigger_rule: none_failed_min_one_success
        script: "finish"
        runtime: "bun"
        timeout: 1200000
        with: {"change_name":"$INPUTS.change_name","change_folder":"$record-archive.output.change_folder","blocked":false,"reason":"","result":"$repair-ranking.output","previous":"","status":"","step":"place-ranking","previous_blocked":false,"op":"place-ranking"}
        when: "$start-round.output.publish == 'true' && $recheck-ranking.output.ok == 'false'"
        output_format: {"type":"object","properties":{"ok":{"type":"boolean"},"problems":{"type":"string"}},"required":["ok","problems"],"additionalProperties":false}

      - id: publish-review-package
        depends_on: ["start-round","check-ranking","recheck-ranking","place-ranking"]
        trigger_rule: none_failed_min_one_success
        when: "$start-round.output.mode != 'merged' && $start-round.output.mode != 'closed'"
        timeout: 1200000
        script: finish
        runtime: bun
        with: {"op":"publish-review-package","change_folder":{"from":"$record-archive.output.change_folder","if_skipped":""},"mode":"$start-round.output.mode","reason":"$start-round.output.reason","round":"$start-round.output.round","review_wait":"$INPUTS.review_wait","archon_url":"$INPUTS.archon_url"}
        output_format: {"type":"object","properties":{"page":{"type":"string"},"message":{"type":"string"},"succeeded":{"type":"boolean"}},"required":["page","message","succeeded"],"additionalProperties":false}

      - id: wait-for-review
        depends_on: [publish-review-package]
        trigger_rule: none_failed_min_one_success
        when: "$INPUTS.review_wait == 'true' && $start-round.output.mode != 'merged' && $start-round.output.mode != 'closed'"
        wait:
          attention: $publish-review-package.output.message
          form: message
          pages: [$publish-review-package.output.page, review-page.html]

  - id: "end-after-acceptance"
    depends_on: [push-recheck, recheck-push-recheck]
    trigger_rule: "none_failed_min_one_success"
    script: "finish"
    runtime: "bun"
    with: {"change_name":"$INPUTS.change_name","change_folder":"$validate-inputs.output.change_dir","blocked":false,"reason":"","result":"","previous":"","status":"","step":"end-after-acceptance","previous_blocked":false,"op":"end-after-acceptance","stop_after":"$INPUTS.stop_after"}
    when: "$validate-inputs.output.finish == 'false'"
    output_format: {"type":"object","properties":{"ok":{"type":"boolean"},"problems":{"type":"string"}},"required":["ok","problems"],"additionalProperties":false}

  - id: end-run
    depends_on: ["review-rounds","end-after-acceptance"]
    trigger_rule: none_failed_min_one_success
    script: finish
    runtime: bun
    with: {"op":"end-run","stop_after":"$INPUTS.stop_after"}
    output_format: {"type":"object","properties":{"succeeded":{"type":"boolean"},"reason":{"type":"string"}},"required":["succeeded","reason"],"additionalProperties":false}
