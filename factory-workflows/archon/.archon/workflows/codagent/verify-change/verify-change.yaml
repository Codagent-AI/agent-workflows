name: codagent-verify-change
description: >-
  Review implementation assumptions, open a draft pull request, and run bounded
  acceptance-test rounds for an implemented change.

inputs:
  change_name: { required: true }
  change_dir: { required: true }
  change_label: { required: true }
  artifact_validation_instruction: { required: true }
  acceptance_rounds:
    default: "3"
    description: Most acceptance-test rounds, 1 to 10.
  # A caller that already reviewed its implementation's assumptions and ran a
  # maintainability pass sets this to skip review-assumptions and simplify. The
  # assumptions handoff check still runs.
  skip_implementation_review: { default: "false" }
  # Ends the acceptance rounds when the lead's fix leaves the tested revision
  # unchanged and writes no acceptance-retest-reason.txt: another tester round
  # could only repeat the last one.
  stop_unchanged_acceptance: { default: "false" }
  # Which findings the lead resolves in each acceptance fix. Callers can narrow
  # it so unrelated problems go to the assumptions ledger instead.
  acceptance_fix_scope:
    default: "Resolve every high-confidence finding you can, including implementation, CI, PR-state, tooling, setup, and environmental problems."

# The run's verdict is whether acceptance converged. A run that did not converge still
# completes, so the handoff reaches a human; its authored outcome is failed.
returns: write-acceptance-status
outcome_field: ready

nodes:
  - id: validate-inputs
    script: validate-inputs
    runtime: bun
    with:
      change_name: $INPUTS.change_name
      acceptance_rounds: $INPUTS.acceptance_rounds
      # The acceptance loop's max_iterations, which must be a literal.
      max_rounds: &max-rounds 10
      skip_implementation_review: $INPUTS.skip_implementation_review
      stop_unchanged_acceptance: $INPUTS.stop_unchanged_acceptance
      acceptance_fix_scope: $INPUTS.acceptance_fix_scope
    output_format:
      type: object
      properties:
        rounds: { type: integer }
        review: { type: boolean }
        stop_unchanged: { type: boolean }
      required: [rounds, review, stop_unchanged]
      additionalProperties: false

  - id: review-assumptions
    depends_on: [validate-inputs]
    when: "$validate-inputs.output.review == 'true'"
    model: ['@lead', large]
    context: fresh
    command: review-assumptions
    with: &change
      change_label: $INPUTS.change_label
      change_name: $INPUTS.change_name
      change_dir: $INPUTS.change_dir

  - id: verify-assumptions-handoff
    depends_on: [validate-inputs, review-assumptions]
    trigger_rule: none_failed_min_one_success
    script: verify-assumptions-handoff
    runtime: bun
    with:
      strict: false
      blocked: false
      reason: ""
    output_format: &check
      type: object
      properties:
        ok: { type: boolean }
        problems: { type: string }
      required: [ok, problems]
      additionalProperties: false

  - id: repair-assumptions-handoff
    depends_on: [verify-assumptions-handoff]
    when: "$verify-assumptions-handoff.output.ok == 'false'"
    model: ['@lead', large]
    context: fresh
    command: repair-assumptions-handoff
    with:
      change_label: $INPUTS.change_label
      change_name: $INPUTS.change_name
      problems: $verify-assumptions-handoff.output.problems
    output_format: &repair
      type: object
      properties:
        blocked: { type: boolean }
        reason: { type: string }
      required: [blocked, reason]
      additionalProperties: false

  - id: recheck-assumptions-handoff
    depends_on: [repair-assumptions-handoff]
    script: verify-assumptions-handoff
    runtime: bun
    with:
      strict: true
      blocked: $repair-assumptions-handoff.output.blocked
      reason: $repair-assumptions-handoff.output.reason
    output_format: *check

  - id: simplify
    depends_on: [verify-assumptions-handoff, recheck-assumptions-handoff]
    trigger_rule: none_failed_min_one_success
    when: "$validate-inputs.output.review == 'true'"
    model: ['@implementor', large]
    context: fresh
    command: simplify
    with: *change

  - id: verify-clean-for-pr
    depends_on: [verify-assumptions-handoff, recheck-assumptions-handoff, simplify]
    trigger_rule: none_failed_min_one_success
    script: verify-clean-for-pr
    runtime: bun
    with:
      strict: false
      blocked: false
      reason: ""
    output_format: *check

  - id: repair-clean-for-pr
    depends_on: [verify-clean-for-pr]
    when: "$verify-clean-for-pr.output.ok == 'false'"
    model: ['@lead', large]
    context: fresh
    command: repair-clean-for-pr
    with:
      change_label: $INPUTS.change_label
      change_name: $INPUTS.change_name
      problems: $verify-clean-for-pr.output.problems
    output_format: *repair

  - id: recheck-clean-for-pr
    depends_on: [repair-clean-for-pr]
    script: verify-clean-for-pr
    runtime: bun
    with:
      strict: true
      blocked: $repair-clean-for-pr.output.blocked
      reason: $repair-clean-for-pr.output.reason
    output_format: *check

  # The lead's session starts here and continues through every acceptance fix.
  - id: open-draft-pr
    depends_on: [verify-clean-for-pr, recheck-clean-for-pr]
    trigger_rule: none_failed_min_one_success
    model: ['@lead', large]
    context: fresh
    command: open-draft-pr
    with: *change
    output_format: *repair

  # open-draft-pr writes the description to pr-body.md; this adds the generated-body
  # markers and puts it into the pull request's body. A blocked open-draft-pr fails here.
  - id: update-pr-body
    depends_on: [open-draft-pr]
    script: update-pr-body
    runtime: bun
    with:
      strict: true
      blocked: $open-draft-pr.output.blocked
      reason: $open-draft-pr.output.reason
    output_format: *check

  # A brief GitHub lag retries inside the check instead of rerunning
  # open-draft-pr.
  - id: verify-draft-pr
    depends_on: [update-pr-body]
    script: check-draft-pr
    runtime: bun
    with:
      attempts: 3
      interval_seconds: 3
      strict: false
      blocked: false
      reason: ""
    output_format: &pr-check
      type: object
      properties:
        ok: { type: boolean }
        problems: { type: string }
        pr_url: { type: string }
      required: [ok, problems, pr_url]
      additionalProperties: false

  # Runs open-draft-pr's step again in its session.
  - id: reopen-draft-pr
    depends_on: [verify-draft-pr]
    when: "$verify-draft-pr.output.ok == 'false'"
    model: ['@lead', large]
    context: { resume: open-draft-pr }
    command: open-draft-pr
    with: *change
    output_format: *repair

  - id: update-reopened-pr-body
    depends_on: [reopen-draft-pr]
    script: update-pr-body
    runtime: bun
    with:
      strict: true
      blocked: $reopen-draft-pr.output.blocked
      reason: $reopen-draft-pr.output.reason
    output_format: *check

  - id: recheck-draft-pr
    depends_on: [update-reopened-pr-body]
    script: check-draft-pr
    runtime: bun
    with:
      attempts: 3
      interval_seconds: 3
      strict: true
      blocked: false
      reason: ""
    output_format: *pr-check

  # Each round runs the independent tester, waits for CI, has the tester hand
  # off, then checks convergence. A round that does not converge is followed by
  # the lead's fix, a push, and a PR check, and the next round retests. The
  # last round ends at the gate, so no fix is ever left untested.
  # max_iterations is the ceiling for acceptance_rounds; the gate ends the
  # rounds at acceptance_rounds.
  - id: acceptance-rounds
    depends_on: [verify-draft-pr, recheck-draft-pr]
    trigger_rule: none_failed_min_one_success
    loop_group:
      max_iterations: *max-rounds
      on_exhausted: complete
      until_bash: 'push=$check-acceptance-progress.output.push; [ "$push" = false ]'
      nodes:
        # The gate must judge only evidence written in this round, so the
        # previous round's status and handoff are cleared.
        - id: reset-round-evidence
          script: reset-round-evidence
          runtime: bun
          with:
            previous_round: $LOOP_PREV.reset-round-evidence.output.round
            rounds: $validate-inputs.output.rounds
          output_format:
            type: object
            properties:
              round: { type: integer }
              last: { type: boolean }
            required: [round, last]
            additionalProperties: false

        - id: acceptance-test
          depends_on: [reset-round-evidence]
          model: ['@tester', medium]
          context: fresh
          command: acceptance-test
          with:
            change_label: $INPUTS.change_label
            change_name: $INPUTS.change_name
            change_dir: $INPUTS.change_dir
            acceptance_round: $reset-round-evidence.output.round
            acceptance_rounds: $validate-inputs.output.rounds
          output_format:
            type: object
            properties:
              ci_ready: { type: boolean }
              reason: { type: string }
            required: [ci_ready, reason]
            additionalProperties: false

        - id: wait-ci
          depends_on: [acceptance-test]
          when: "$acceptance-test.output.ci_ready == 'true'"
          script: wait-ci
          runtime: bun
          # The wait polls for max_minutes; the timeout leaves room for the report.
          timeout: 1200000
          with:
            round: $reset-round-evidence.output.round
            max_minutes: 15
            interval_seconds: 30
          output_format:
            type: object
            properties:
              status: { type: string, enum: [passed, failed, pending, comments, error] }
              had_checks: { type: boolean }
              head_moved: { type: boolean }
              report: { type: string }
            required: [status, had_checks, head_moved, report]
            additionalProperties: false

        - id: acceptance-handoff
          depends_on: [acceptance-test, wait-ci]
          trigger_rule: none_failed_min_one_success
          model: ['@tester', medium]
          context: { resume: acceptance-test }
          command: acceptance-handoff
          with:
            ci_status: { from: $wait-ci.output.status, if_skipped: "not run" }
            ci_report: { from: $wait-ci.output.report, if_skipped: "none" }
            ci_reason: $acceptance-test.output.reason

        - id: acceptance-gate
          depends_on: [acceptance-handoff]
          script: acceptance-gate
          runtime: bun
          with:
            last: $reset-round-evidence.output.last
          output_format:
            type: object
            properties:
              ready: { type: boolean }
              fix: { type: boolean }
              reasons: { type: string }
            required: [ready, fix, reasons]
            additionalProperties: false

        # The tester has read any retest reason; a stale one must not keep the
        # rounds going after the next fix.
        - id: clear-retest-reason
          depends_on: [acceptance-gate]
          when: "$acceptance-gate.output.fix == 'true'"
          script: clear-retest-reason
          runtime: bun

        - id: acceptance-fix
          depends_on: [clear-retest-reason]
          model: ['@lead', large]
          context: { resume: open-draft-pr }
          command: acceptance-fix
          with:
            change_label: $INPUTS.change_label
            change_name: $INPUTS.change_name
            acceptance_round: $reset-round-evidence.output.round
            acceptance_fix_scope: $INPUTS.acceptance_fix_scope
            artifact_validation_instruction: $INPUTS.artifact_validation_instruction

        - id: check-acceptance-progress
          depends_on: [acceptance-gate, acceptance-fix]
          trigger_rule: none_failed_min_one_success
          script: check-acceptance-progress
          runtime: bun
          with:
            fix: $acceptance-gate.output.fix
            stop_unchanged: $validate-inputs.output.stop_unchanged
          output_format:
            type: object
            properties:
              progressed: { type: boolean }
              push: { type: boolean }
            required: [progressed, push]
            additionalProperties: false

        - id: acceptance-push
          depends_on: [check-acceptance-progress]
          when: "$check-acceptance-progress.output.push == 'true'"
          script: acceptance-push
          runtime: bun
          with:
            strict: false
            blocked: false
            reason: ""
          output_format: *check

        - id: repair-acceptance-push
          depends_on: [acceptance-push]
          when: "$acceptance-push.output.ok == 'false'"
          model: ['@lead', large]
          context: { resume: acceptance-fix }
          command: repair-acceptance-push
          with:
            change_label: $INPUTS.change_label
            change_name: $INPUTS.change_name
            problems: $acceptance-push.output.problems
          output_format: *repair

        - id: recheck-acceptance-push
          depends_on: [repair-acceptance-push]
          script: acceptance-push
          runtime: bun
          with:
            strict: true
            blocked: $repair-acceptance-push.output.blocked
            reason: $repair-acceptance-push.output.reason
          output_format: *check

        - id: verify-acceptance-pr
          depends_on: [acceptance-push, recheck-acceptance-push]
          trigger_rule: none_failed_min_one_success
          script: check-draft-pr
          runtime: bun
          with:
            attempts: 10
            interval_seconds: 3
            strict: false
            blocked: false
            reason: ""
          output_format: *pr-check

        - id: repair-acceptance-pr
          depends_on: [verify-acceptance-pr]
          when: "$verify-acceptance-pr.output.ok == 'false'"
          model: ['@lead', large]
          context: { resume: acceptance-fix }
          command: repair-acceptance-pr
          with:
            change_label: $INPUTS.change_label
            change_name: $INPUTS.change_name
            problems: $verify-acceptance-pr.output.problems
          output_format: *repair

        - id: recheck-acceptance-pr
          depends_on: [repair-acceptance-pr]
          script: check-draft-pr
          runtime: bun
          with:
            attempts: 10
            interval_seconds: 3
            strict: true
            blocked: $repair-acceptance-pr.output.blocked
            reason: $repair-acceptance-pr.output.reason
          output_format: *pr-check

  # Writes the status and the handoff and reads both back, failing the run when either
  # is wrong.
  - id: write-acceptance-status
    depends_on: [acceptance-rounds]
    script: write-acceptance-status
    runtime: bun
    with:
      rounds: $validate-inputs.output.rounds
    output_format:
      type: object
      properties:
        ready: { type: boolean }
        status: { type: string, enum: [ACCEPTANCE_COMPLETE, ACCEPTANCE_FAILED] }
        message: { type: string }
      required: [ready, status, message]
      additionalProperties: false
