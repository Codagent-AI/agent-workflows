# A push repair that reports itself blocked fails its recheck, which fails the rounds.
validate-inputs: { change_dir: tests/data/changes/valid-change, artifact_validation_instruction: "When an approved artifact changed, run `openspec validate --type change \"valid-change\"`.", rounds: 3, review: false, stop_unchanged: true }
verify-assumptions-handoff: { ok: true, problems: "" }
verify-clean-for-pr: { ok: true, problems: "" }
open-draft-pr: { blocked: false, reason: "" }
update-pr-body: { ok: true, problems: "" }
verify-draft-pr: { ok: true, problems: "", pr_url: "https://github.com/example/greeter/pull/7" }
reset-round-evidence: { round: 0, last: false }
acceptance-test: { ci_ready: true, reason: "" }
wait-ci: { status: passed, had_checks: true, head_moved: false, report: "ci/round-0.md" }
acceptance-handoff: "Wrote the handoff; READY."
acceptance-gate: { ready: false, fix: true, reasons: "- the tester's round status is 'NOT_READY'" }
clear-retest-reason: "cleared"
acceptance-fix: "Fixed F-1 and committed."
check-acceptance-progress: { progressed: true, push: true }
acceptance-push: { ok: false, problems: "acceptance push: git push failed" }
repair-acceptance-push: { blocked: true, reason: "the remote history diverged" }
exec-code: true
fixture:
  expect: failed
  fail-node: [recheck-acceptance-push, acceptance-rounds]
  reached: [repair-acceptance-push]
  inputs:
    change_name: valid-change
    changes_root: tests/data/changes
    change_kind: spec-driven
    artifact_validation_instruction: Validate any changed spec artifact.
    skip_implementation_review: "true"
    stop_unchanged_acceptance: "true"
