# A dirty worktree whose repair reports itself blocked fails the recheck before the PR opens.
validate-inputs: { rounds: 3, review: false, stop_unchanged: true }
verify-assumptions-handoff: { ok: true, problems: "" }
verify-clean-for-pr: { ok: false, problems: "working tree changes remain after validation" }
repair-clean-for-pr: { blocked: true, reason: "the untracked build output needs a gitignore decision" }
exec-code: true
fixture:
  expect: failed
  fail-node: recheck-clean-for-pr
  reached: [repair-clean-for-pr]
  inputs:
    change_name: greet-by-name
    change_dir: tests/data/changes/valid-change
    change_label: spec-driven change
    artifact_validation_instruction: Validate any changed spec artifact.
    skip_implementation_review: "true"
    stop_unchanged_acceptance: "true"
