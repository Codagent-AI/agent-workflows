# A standalone run reviews the implementation's assumptions and simplifies before the PR.
validate-inputs: { rounds: 3, review: true, stop_unchanged: false }
review-assumptions: "Wrote acceptance-assumptions.md."
verify-assumptions-handoff: { ok: true, problems: "" }
simplify: "No cleanup needed."
verify-clean-for-pr: { ok: true, problems: "" }
open-draft-pr: { blocked: false, reason: "" }
verify-draft-pr: { ok: true, problems: "", pr_url: "https://github.com/example/greeter/pull/7" }
reset-round-evidence: { round: 0, last: false }
acceptance-test: { ci_ready: true, reason: "" }
wait-ci: { status: passed, had_checks: true, head_moved: false, report: "ci/round-0.md" }
acceptance-handoff: "Wrote the handoff; READY."
acceptance-gate: { ready: true, fix: false, reasons: "" }
check-acceptance-progress: { progressed: true, push: false }
write-acceptance-status: { ready: true, status: ACCEPTANCE_COMPLETE, message: "acceptance preparation complete" }
fixture:
  expect: completed
  authored: succeeded
  reached: [review-assumptions, simplify, open-draft-pr]
  resolved-text-contains:
    review-assumptions: "You are running autonomously with no human in the loop."
    simplify: "You are running autonomously with no human in the loop."
  inputs:
    change_name: greet-by-name
    change_dir: tests/data/changes/valid-change
    change_label: spec-driven change
    artifact_validation_instruction: Validate any changed spec artifact.
    skip_implementation_review: "false"
    stop_unchanged_acceptance: "false"
