# A failed push reaches the lead's repair in the fix's session, and the recheck passes.
validate-inputs: { rounds: 3, review: false, stop_unchanged: true }
verify-assumptions-handoff: { ok: true, problems: "" }
verify-clean-for-pr: { ok: true, problems: "" }
open-draft-pr: { blocked: false, reason: "" }
verify-draft-pr: { ok: true, problems: "", pr_url: "https://github.com/example/greeter/pull/7" }
reset-round-evidence: { round: 0, last: false }
acceptance-test: { ci_ready: true, reason: "" }
wait-ci: { status: passed, had_checks: true, head_moved: false, report: "ci/round-0.md" }
acceptance-handoff: "Wrote the handoff; READY."
acceptance-gate: { ready: false, fix: true, reasons: "- the tester's round status is 'NOT_READY'" }
clear-retest-reason: "cleared"
acceptance-fix: "Fixed F-1 and committed."
check-acceptance-progress: { progressed: true, push: true }
acceptance-push: { ok: false, problems: "acceptance push: git push failed: rejected (non-fast-forward)" }
repair-acceptance-push: { blocked: false, reason: "" }
recheck-acceptance-push: { ok: true, problems: "" }
verify-acceptance-pr: { ok: true, problems: "", pr_url: "https://github.com/example/greeter/pull/7" }
write-acceptance-status: "acceptance preparation complete"
verify-acceptance-handoff: { ok: true, problems: "" }
fixture:
  expect: completed
  reached: [repair-acceptance-push, recheck-acceptance-push, verify-acceptance-pr]
  resolved-text-contains:
    repair-acceptance-push: "rejected (non-fast-forward)"
  inputs:
    change_name: greet-by-name
    change_dir: tests/data/changes/valid-change
    change_label: spec-driven change
    artifact_validation_instruction: Validate any changed spec artifact.
    skip_implementation_review: "true"
    stop_unchanged_acceptance: "true"
