# A failed validation reaches a fresh lead repair with the validation output, and the recheck
# after the repair passes. The dry run does not evaluate the loop's until_bash, so a second
# repair is out of reach; the script tests cover the checks it would run.
validate-definition: { ok: false, problems: "validate-planning-artifacts: missing or empty design.md" }
repair-definition: { blocked: false, reason: "" }
definition-recheck: { ok: true, problems: "" }
verify-definition: { ok: true, problems: "" }
fixture:
  expect: completed
  inputs:
    change_name: greet-by-name
    change_dir: tests/data/changes/invalid-change
    change_label: spec-driven change
    change_kind: spec-driven
  reached: [repair-definition, definition-recheck, verify-definition]
  resolved-text-contains:
    repair-definition: "You are running autonomously with no human in the loop."
