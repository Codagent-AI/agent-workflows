# A repair that reports itself blocked fails the recheck before it rechecks.
commit-definition: { ok: false, problems: "commit-change-plan: git commit failed", message: "" }
repair-commit-definition: { blocked: true, reason: "only a maintainer can bypass the commit hook" }
exec-code: true
fixture:
  expect: failed
  fail-node: recheck-commit-definition
  inputs:
    change_name: greet-by-name
    change_dir: tests/data/changes/valid-change
    change_kind: openspec
  reached: [repair-commit-definition]
  resolved-text-contains:
    repair-commit-definition: "You are running autonomously with no human in the loop."
